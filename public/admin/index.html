<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuMu Studio · 草稿工作台</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#242632}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e7e9f1;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}header small{display:block;color:#858895;margin-top:3px}a{color:#4463c9;text-decoration:none}main{max-width:1100px;margin:auto;padding:18px}.notice{background:#fff8e8;color:#795a24;padding:13px;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:16px}.layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{border:1px solid #e6e8f0;background:white;border-radius:12px;padding:13px;text-align:left}.menu button.active{background:#e9eefc;border-color:#9db2ec;color:#2c4d9a;font-weight:700}.panel{background:white;border:1px solid #eceef3;border-radius:17px;padding:20px;min-height:400px}h2{font-size:20px;margin:0 0 8px}.muted{color:#858895;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #dfe2eb;border-radius:10px;padding:11px;background:white;color:#242632}textarea{min-height:90px;resize:vertical}.btn{border:0;background:#4165d6;color:white;border-radius:10px;padding:11px 15px;margin:12px 8px 0 0}.secondary{background:#eef1f8;color:#3c4665}.danger{background:#fff0f0;color:#9a3535}.item{border:1px solid #e8eaf0;border-radius:12px;padding:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{display:block;color:#888;margin-top:4px}.item button{border:0;background:#fff0f0;color:#a33;border-radius:8px;padding:7px 10px}.empty{padding:18px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:12px;margin-top:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#777;line-height:1.7}.pill{font-size:11px;background:#eef1f7;border-radius:50px;padding:5px 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.toolbar button{border:1px solid #e0e4ed;border-radius:9px;padding:9px 12px;background:white}.phone{width:185px;height:310px;border:7px solid #222;border-radius:30px;background:linear-gradient(145deg,#f6d5e7,#aabcf0);margin:16px auto;padding:30px 12px;text-align:center}.phone strong{font-size:30px}.phone small{display:block}.hidden{display:none}@media(max-width:700px){main{padding:12px}.layout{display:block}.menu{flex-direction:row;overflow:auto;padding-bottom:10px;margin-bottom:8px}.menu button{white-space:nowrap;flex-shrink:0;padding:11px}.panel{padding:16px;min-height:400px}.row{grid-template-columns:1fr}header{padding:14px}}</style></head><body><header><div><b>LuMu Studio</b><small>手机优先 · 本机草稿工作台</small></div><a href="../">试玩游戏 ↗</a></header><main><div class="notice"><b>当前是本机草稿编辑器，并非正式管理后台。</b>草稿只保存在当前浏览器，尚未同步游戏或云端；请定期导出备份。不要在这里填写真实密码、私人聊天或敏感资料。</div><div class="layout"><nav class="menu" id="menu"></nav><section class="panel"><div id="content"></div></section></div></main><script>
const KEY='lumu-studio-draft-v1';
const defaults={appearance:{title:'LuMu',theme:'#f2a4c9',wallpaper:''},people:[{id:'wang_lujie',name:'王橹杰',remark:'',role:'手机主人'},{id:'mu_zhicheng',name:'穆祉丞',remark:'',role:'主线联系人'}],apps:[{id:'wechat',name:'微信',iconUrl:'',enabled:true,placement:'dock'},{id:'phone',name:'电话',iconUrl:'',enabled:true,placement:'dock'},{id:'photos',name:'照片',iconUrl:'',enabled:true,placement:'home'},{id:'notes',name:'备忘录',iconUrl:'',enabled:true,placement:'home'},{id:'countdown',name:'倒数日',iconUrl:'',enabled:true,placement:'home'}],wechat:{moments:[],conversations:[]},chats:[],events:[],calls:[],photos:[],notes:[],countdowns:[]};
const sections=[['appearance','📱 手机外观'],['apps','🧩 APP 管理'],['people','👥 联系人'],['wechat','💬 微信聊天'],['moments','🟢 朋友圈'],['calls','📞 电话与通话'],['photos','🖼️ 相册'],['notes','📝 备忘录'],['countdowns','📅 倒数日'],['events','✨ 剧情与彩蛋'],['versions','🕓 备份']];
const clone=x=>JSON.parse(JSON.stringify(x));
let data=clone(defaults),section='apps';
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&typeof old==='object')data={...data,...old,appearance:{...defaults.appearance,...old.appearance},wechat:{...defaults.wechat,...old.wechat}}}catch(e){console.warn('Draft recovery',e)}
for(const k of ['people','apps','chats','events','calls','photos','notes','countdowns'])if(!Array.isArray(data[k]))data[k]=clone(defaults[k]);
for(const k of ['moments','conversations'])if(!Array.isArray(data.wechat[k]))data.wechat[k]=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存失败：'+e.message);return false}};
const menu=document.getElementById('menu'),content=document.getElementById('content');
const input=(name,label,type='text',value='')=>'<label>'+esc(label)+'</label><input name="'+esc(name)+'" type="'+type+'" value="'+esc(value)+'">';
const area=(name,label)=>'<label>'+esc(label)+'</label><textarea name="'+esc(name)+'"></textarea>';
const choose=(name,label,items)=>'<label>'+esc(label)+'</label><select name="'+esc(name)+'">'+items.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('')+'</select>';
const persons=()=>data.people.map(p=>[p.id,p.remark||p.name]);
const list=(key,fmt)=>'<div class="records">'+data[key].map((x,i)=>'<div class="item"><div><b>'+esc(fmt(x))+'</b></div><button type="button" data-remove="'+esc(key)+'" data-index="'+i+'">删除</button></div>').join('')+'</div>';
const wxlist=(key,fmt)=>'<div class="records">'+data.wechat[key].map((x,i)=>'<div class="item"><div><b>'+esc(fmt(x))+'</b></div><button type="button" data-wxremove="'+key+'" data-index="'+i+'">删除</button></div>').join('')+'</div>';
function draw(){
menu.innerHTML=sections.map(([key,label])=>'<button type="button" data-section="'+key+'" class="'+(key===section?'active':'')+'">'+label+'</button>').join('');
let html='';
if(section==='appearance')html='<h2>手机外观</h2><p class="muted">当前为本机草稿，不影响线上玩家端。</p><form data-form="appearance">'+input('title','游戏标题','text',data.appearance.title)+input('theme','主题颜色','color',data.appearance.theme)+input('wallpaper','壁纸 HTTPS 链接','url',data.appearance.wallpaper)+'<button class="btn">保存外观</button></form>';
else if(section==='apps')html='<h2>APP 管理</h2><p class="muted">支持新增、编辑名称、图标链接、排序及显示位置。尚未同步玩家桌面。</p><form data-form="app">'+input('name','APP 名称')+input('id','唯一英文 ID')+input('iconUrl','图标 HTTPS 链接（可留空）')+choose('placement','位置',[['home','主屏幕'],['dock','Dock 栏']])+'<button class="btn">新增 APP</button></form><div class="records">'+data.apps.map((a,i)=>'<div class="item"><div><b>'+esc(a.name)+'</b><small>'+esc(a.id)+' · '+(a.enabled?'显示':'隐藏')+' · '+esc(a.placement)+'</small></div><div><button data-appaction="edit" data-index="'+i+'">编辑</button><button data-appaction="toggle" data-index="'+i+'">'+(a.enabled?'隐藏':'显示')+'</button><button data-appaction="up" data-index="'+i+'">↑</button><button data-appaction="down" data-index="'+i+'">↓</button></div></div>').join('')+'</div>';
else if(section==='people')html='<h2>人物与联系人</h2><form data-form="person">'+input('name','姓名')+input('remark','微信备注')+'<button class="btn">新增联系人</button></form>'+list('people',x=>x.name+' · '+(x.remark||'无备注'))+'<p class="hint">主线人物 ID 不会因改备注而变化。</p>';
else if(section==='wechat')html='<h2>微信聊天编辑</h2><p class="muted">可配置文字、图片、语音、视频、通话记录等模拟消息。</p><form data-form="wechat">'+choose('personId','会话对象',persons())+choose('sender','发送方',[['contact','联系人'],['owner','王橹杰'],['system','系统']])+choose('type','消息类型',[['text','文字'],['image','图片'],['voice','语音'],['video','视频'],['call','通话记录'],['transfer','模拟转账'],['recalled','撤回']])+area('content','内容或素材 HTTPS 链接')+input('time','时间','datetime-local')+'<button class="btn">添加消息</button></form>'+wxlist('conversations',x=>(data.people.find(p=>p.id===x.personId)?.name||'联系人')+' · '+x.type+' · '+x.content.slice(0,60));
else if(section==='moments')html='<h2>朋友圈</h2><form data-form="moment">'+choose('authorId','发布人',persons())+area('text','朋友圈内容')+input('imageUrl','配图 HTTPS 链接（可留空）')+'<button class="btn">添加动态</button></form>'+wxlist('moments',x=>x.text.slice(0,80));
else if(section==='calls')html='<h2>电话与微信通话</h2><form data-form="call">'+choose('personId','联系人',persons())+choose('type','通话类型',[['phone-in','手机来电'],['phone-out','手机去电'],['wechat-voice-in','微信语音来电'],['wechat-video-in','微信视频来电']])+choose('status','状态',[['answered','已接听'],['missed','未接听'],['declined','拒接']])+input('duration','通话时长（秒）','number','0')+'<button class="btn">添加记录</button></form>'+list('calls',x=>x.type+' · '+x.status+' · '+x.duration+'秒');
else if(section==='photos')html='<h2>相册</h2><form data-form="photo">'+input('title','照片标题')+input('url','图片 HTTPS 链接','url')+input('album','相簿名称','text','最近项目')+input('date','拍摄日期','date')+'<button class="btn">添加照片</button></form>'+list('photos',x=>x.title+' · '+x.album);
else if(section==='notes')html='<h2>备忘录</h2><form data-form="note">'+input('title','标题')+input('folder','文件夹','text','备忘录')+area('body','正文')+'<button class="btn">添加备忘录</button></form>'+list('notes',x=>x.title+' · '+x.folder);
else if(section==='countdowns')html='<h2>倒数日</h2><form data-form="countdown">'+input('title','纪念日名称')+input('date','日期','date')+choose('type','类型',[['anniversary','已过去天数'],['countdown','未来倒计时']])+input('color','主题色','color','#f2a4c9')+'<button class="btn">添加纪念日</button></form>'+list('countdowns',x=>x.title+' · '+x.date);
else if(section==='events')html='<h2>剧情与彩蛋</h2><form data-form="event">'+input('name','事件名称')+choose('trigger','触发应用',[['wechat','微信'],['photos','相册'],['notes','备忘录'],['countdown','倒数日'],['tfamily','T-FAMILY']])+choose('action','触发效果',[['wechat','收到微信消息'],['photo','解锁照片'],['remark','修改备注'],['notice','通知']])+area('condition','触发条件说明')+'<button class="btn">添加事件草稿</button></form>'+list('events',x=>x.name+' · '+x.trigger+' → '+x.action);
else html='<h2>草稿备份</h2><p class="muted">草稿只在当前浏览器中，导出 JSON 可保存副本。导入会覆盖当前草稿。</p><div class="toolbar"><button id="export" type="button">导出 JSON</button><button id="importBtn" type="button">导入 JSON</button><button id="reset" type="button">重置草稿</button></div><input id="importFile" type="file" accept=".json" class="hidden">';
content.innerHTML=html;
}
menu.addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(b){section=b.dataset.section;draw()}});
content.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const v=Object.fromEntries(new FormData(form).entries());const type=form.dataset.form;const required=(...keys)=>keys.every(k=>String(v[k]||'').trim());if(type==='appearance')data.appearance={...data.appearance,...v};else if(type==='app'){if(!required('name','id')||!/^[a-z][a-z0-9_-]*$/.test(v.id)||data.apps.some(x=>x.id===v.id))return alert('请填写名称和不重复的英文 ID');if(v.iconUrl&&!/^https:\/\//.test(v.iconUrl))return alert('图标须为 HTTPS 链接');data.apps.push({...v,enabled:true})}else if(type==='person'){if(!required('name'))return alert('请输入姓名');data.people.push({...v,id:id(),role:'联系人'})}else if(type==='wechat'){if(!required('personId','content'))return alert('请选择联系人并填写内容');data.wechat.conversations.push({...v,id:id()})}else if(type==='moment'){if(!required('authorId','text'))return alert('请输入内容');data.wechat.moments.push({...v,id:id()})}else if(type==='call')data.calls.push({...v,id:id()});else if(type==='photo'){if(!required('url')||!/^https:\/\//.test(v.url))return alert('请输入 HTTPS 图片链接');data.photos.push({...v,id:id()})}else if(type==='note'){if(!required('title'))return alert('请输入标题');data.notes.push({...v,id:id()})}else if(type==='countdown'){if(!required('title','date'))return alert('请输入名称和日期');data.countdowns.push({...v,id:id()})}else if(type==='event'){if(!required('name'))return alert('请输入事件名称');data.events.push({...v,id:id()})}persist();draw()});
content.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.index);if(b.dataset.remove){if(confirm('确定删除？')){data[b.dataset.remove].splice(i,1);persist();draw()}}else if(b.dataset.wxremove){if(confirm('确定删除？')){data.wechat[b.dataset.wxremove].splice(i,1);persist();draw()}}else if(b.dataset.appaction){const a=data.apps[i],act=b.dataset.appaction;if(act==='toggle')a.enabled=!a.enabled;else if(act==='edit'){const name=prompt('APP 名称',a.name);if(name===null||!name.trim())return;const iconUrl=prompt('图标 HTTPS 链接（可留空）',a.iconUrl||'');if(iconUrl===null||iconUrl&&!/^https:\/\//.test(iconUrl))return alert('链接无效');a.name=name.trim();a.iconUrl=iconUrl}else if(act==='up'&&i>0)[data.apps[i-1],data.apps[i]]=[data.apps[i],data.apps[i-1]];else if(act==='down'&&i<data.apps.length-1)[data.apps[i+1],data.apps[i]]=[data.apps[i],data.apps[i+1]];persist();draw()}else if(b.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='lumu-studio-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.id==='importBtn')document.getElementById('importFile').click();else if(b.id==='reset'&&confirm('清空所有本机草稿？')){data=clone(defaults);persist();draw()}});
content.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{const f=e.target.files[0];if(!f)return;const next=JSON.parse(await f.text());if(!next||!Array.isArray(next.people)||!Array.isArray(next.apps))throw Error('JSON 结构不正确');if(confirm('导入并覆盖当前草稿？')){data={...clone(defaults),...next};persist();draw()}}catch(err){alert('导入失败：'+err.message)}});
draw();
</script></body></html>
