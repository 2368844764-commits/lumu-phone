 let form='';
 if(selected){const s=selected;const messages=(s.messages||[]).map(m=>[m.delay,m.from==='owner'?'我':'对方',m.text].join('|')).join('\n');
 form='<h3>编辑视频通话</h3><div class="formgrid"><label class="field">场景名称<input data-videofield="title" value="'+esc(s.title||'')+'"></label><label class="field">通话联系人<select data-videofield="personId">'+peopleOpts(s.personId)+'</select></label><label class="field">触发方式<select data-videofield="trigger">'+[['manual','玩家拨打'],['delay','进入微信后延时来电'],['keyword','发送关键词后来电']].map(([v,n])=>'<option value="'+v+'" '+(s.trigger===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label class="field">来电延迟（毫秒）<input type="number" min="0" data-videofield="delayMs" value="'+esc(s.delayMs||0)+'"></label><label class="field">触发关键词<input data-videofield="keyword" value="'+esc(s.keyword||'')+'"></label><label class="field">小窗模式<select data-videofield="selfMode">'+[['off','关闭摄像头'],['avatar','头像'],['video','第二段视频']].map(([v,n])=>'<option value="'+v+'" '+(s.selfMode===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label class="field wide">主画面 MP4 URL<input data-videofield="mainVideo" value="'+esc(s.mainVideo||'')+'"></label><label class="field wide">小窗 MP4 URL<input data-videofield="selfVideo" value="'+esc(s.selfVideo||'')+'"></label><label class="field">上传主视频<input type="file" accept="video/mp4" data-video-upload="mainVideo"></label><label class="field">上传小窗视频<input type="file" accept="video/mp4" data-video-upload="selfVideo"></label><label class="check"><input type="checkbox" id="videoEnabled" '+(s.enabled!==false?'checked':'')+'>启用此通话</label><label class="check"><input type="checkbox" id="videoAutoHangup" '+(s.autoHangup?'checked':'')+'>视频结束自动挂断</label><label class="field wide">预设消息时间轴（每行：秒数|对方或我|消息内容）<textarea id="videoMessages" style="min-height:140px">'+esc(messages)+'</textarea></label></div><p class="hint">视频上传到 Supabase Storage 的 lumu-media 公共存储桶。必须事先存在该存储桶及允许管理员上传的策略；如果不存在，上传会明确报错，不会影响草稿。不要上传无授权素材。</p><div class="actions"><button class="primary" id="saveVideoScene">保存场景到草稿</button><button class="danger" id="deleteVideoScene">删除场景</button></div>';
 }
 return layout('<p class="note">视频通话复用微信联系人。创建场景、保存草稿后，可从「草稿与发布」预览或发布；发布前不影响玩家。未配置视频时仅显示模拟通话界面。</p>'+list+form,'微信视频通话管理');
}
async function uploadVideoAsset(file){
 if(!file)throw Error('未选择文件');
 if(file.type!=='video/mp4')throw Error('请选择 MP4 视频');
 if(file.size>50*1024*1024)throw Error('视频大小不能超过 50 MB');
 if(!token)throw Error('请先登录管理员后台');
 const name='video-calls/'+id().replace(/[^a-zA-Z0-9-]/g,'')+'.mp4';
 const res=await fetch(BASE+'/storage/v1/object/lumu-media/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'video/mp4','x-upsert':'false'},body:file});
 if(!res.ok)throw Error('视频上传失败 HTTP '+res.status+'：'+(await res.text()).slice(0,160)+'。请检查 lumu-media 公共存储桶与上传权限');
 return BASE+'/storage/v1/object/public/lumu-media/'+name;
}
function bindVideo(){
 if($('addVideoScene'))$('addVideoScene').onclick=()=>{const s={id:id(),title:'新视频通话',personId:people()[0]?.id||'mu_zhicheng',trigger:'manual',enabled:true,selfMode:'off',messages:[]};wx().videoCalls.push(s);videoId=s.id;change();render()};
 document.querySelectorAll('[data-video]').forEach(el=>el.onclick=()=>{videoId=el.dataset.video;render()});
 const scene=wx().videoCalls.find(s=>s.id===videoId);if(!scene)return;
 if($('saveVideoScene'))$('saveVideoScene').onclick=()=>{
  document.querySelectorAll('[data-videofield]').forEach(el=>scene[el.dataset.videofield]=el.value);
  scene.delayMs=Math.max(0,Number(scene.delayMs)||0);
  scene.enabled=$('videoEnabled').checked;scene.autoHangup=$('videoAutoHangup').checked;
  const lines=$('videoMessages').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const messages=[];
  for(const line of lines){const parts=line.split('|');const delay=Number(parts.shift()),who=parts.shift(),text=parts.join('|').trim();if(!Number.isFinite(delay)||delay<0||!text||!['对方','我'].includes(who)){setStatus('消息时间轴格式有误：'+line);return}messages.push({delay,from:who==='我'?'owner':'contact',text})}
  scene.messages=messages.sort((a,b)=>a.delay-b.delay);change();render();setStatus('场景已保存到本地草稿，请点击「保存全部草稿」再发布');
 };
 if($('deleteVideoScene'))$('deleteVideoScene').onclick=()=>{if(!confirm('仅从草稿中删除该通话场景？'))return;wx().videoCalls=wx().videoCalls.filter(s=>s.id!==videoId);videoId='';change();render()};
 document.querySelectorAll('[data-video-upload]').forEach(el=>el.onchange=async e=>{try{setStatus('正在上传视频…');const url=await uploadVideoAsset(e.target.files?.[0]);scene[el.dataset.videoUpload]=url;change();render();setStatus('视频已上传，记得保存管理员草稿并发布')}catch(err){setStatus(err.message)}});
}

function renderRelease(){return layout('<p class="note">管理员草稿与正式玩家内容完全隔离。发布会整体更新当前内容快照并保留原有未编辑字段，不清除玩家个人消息。发布前请下载备份。</p><div class="row"><div><strong>数据库内容版本</strong><small>revision '+revision+'</small></div><span class="pill">'+(dirty?'待保存':'已保存')+'</span></div><div class="actions"><button class="primary" id="save">保存草稿</button><button class="secondary" id="previewDraft">预览微信草稿</button><button class="secondary" id="backup">导出完整草稿 JSON</button><button class="danger" id="publish">发布到正式游戏</button></div>','版本与发布')}
function peopleOpts(current='',includeGroups=false){
 const entries=[{id:'owner',name:'手机主人',remark:wx().settings.owner?.name||'机主'},...people()];
 const opts=entries.map(p=>'<option value="'+esc(p.id)+'" '+(current===p.id?'selected':'')+'>'+esc((p.remark||p.nickname||p.name||p.id)+(p.name&&p.remark?'（'+p.name+'）':''))+'</option>');
 if(includeGroups){const groups=wx().groups||[];if(groups.length){opts.push('<optgroup label="微信群聊">');for(const g of groups)opts.push('<option value="'+esc(g.id)+'" '+(current===g.id?'selected':'')+'>'+esc(g.name||g.id)+'（群聊）</option>');opts.push('</optgroup>')}}
 if(current&&!entries.some(p=>p.id===current)&&!(includeGroups&&wx().groups.some(g=>g.id===current)))opts.unshift('<option value="'+esc(current)+'" selected>历史记录：'+esc(current)+'（未在当前名单）</option>');
 return opts.join('')
}
function edit(kind,obj){const fields=kind==='group'?[['name','群聊名称'],['members','选择群聊成员']]:kind==='message'?[['personId','所属联系人 / 群聊'],['sender','发言人（owner/contact）'],['type','类型（text/image）'],['content','消息内容'],['time','发送时间 ISO']]:kind==='moment'?[['authorId','朋友圈发布人'],['text','文字内容'],['time','发布时间（支持 2026-10-24 12:30 或 ISO 时间）'],['imageUrl','图片 URL / 上传后自动填写']]:kind==='rule'?[['personId','所属联系人'],['trigger','关键词'],['reply','回复文本'],['delayMs','延迟毫秒']]:[['personId','所属联系人'],['content','消息正文'],['trigger','触发模式（delay/at）'],['delayMs','延迟毫秒'],['at','指定时间（ISO）']];
$('editArea').innerHTML='<div class="note"><b>'+esc(obj.id?'编辑':'新增')+'</b> · 编辑后保存到草稿，不会立即发布</div><div class="formgrid">'+fields.map(([k,label])=>'<label class="field">'+label+(k==='personId'||k==='authorId'?'<select data-edit="'+k+'">'+peopleOpts(obj[k]||'',kind==='message')+'</select><span class="hint">选择联系人'+(kind==='message'?'或群聊':'')+'，系统自动保存 ID</span>':k==='sender'?'<select data-edit="sender"><option value="owner" '+(obj.sender==='owner'?'selected':'')+'>手机主人发送</option><option value="contact" '+(obj.sender!=='owner'?'selected':'')+'>联系人发送</option></select>':k==='members'?'<div class="memberChoices">'+people().map(p=>'<label class="check"><input type="checkbox" data-member="'+esc(p.id)+'" '+((obj.members||[]).includes(p.id)?'checked':'')+'>'+esc(p.remark||p.nickname||p.name||p.id)+'</label>').join('')+'</div>':'<input data-edit="'+k+'" value="'+esc(obj[k]||'')+'">')+'</label>').join('')+'</div>'+(kind==='moment'?'<label class="field">上传动态图片<input type="file" id="momentImage" accept="image/*"></label>':'')+'<div class="actions"><button id="commitEdit" class="primary">保存该条</button><button id="removeEdit" class="danger">删除</button></div>';
if(kind==='moment')$('momentImage').onchange=async e=>{try{obj.imageUrl=await resizeImage(e.target.files?.[0],960);const input=document.querySelector('[data-edit="imageUrl"]');if(input)input.value=obj.imageUrl;setStatus('图片已处理，请保存该条动态，再保存草稿并发布')}catch(err){alert(err.message)}};
$('commitEdit').onclick=()=>{for(const el of document.querySelectorAll('[data-edit]'))obj[el.dataset.edit]=el.value;if(kind==='group')obj.members=Array.from(document.querySelectorAll('[data-member]:checked')).map(el=>el.dataset.member);if(kind==='moment')obj.authorId ||= 'owner';if(kind==='message')obj.sender ||= 'contact';if(kind==='scheduled')obj.trigger ||= 'delay';obj.id ||= id();const target=kind==='group'?wx().groups:kind==='message'?wx().messages:kind==='moment'?wx().moments:kind==='rule'?wx().replyRules:wx().scheduledMessages;const idx=target.findIndex(x=>x.id===obj.id);if(idx<0)target.push(obj);else target[idx]=obj;change();render()};
$('removeEdit').onclick=()=>{if(!obj.id)return;const target=kind==='group'?wx().groups:kind==='message'?wx().messages:kind==='moment'?wx().moments:kind==='rule'?wx().replyRules:wx().scheduledMessages;if(!confirm('仅从管理员草稿中删除此项？'))return;target.splice(target.findIndex(x=>x.id===obj.id),1);change();render()}}
async function resizeImage(file,limit=450){if(!file)throw Error('没有选择照片');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('只能上传图片');if(file.size>8e6)throw Error('图片不能大于 8 MB');const img=await createImageBitmap(file);const f=Math.min(1,limit/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*f));cv.height=Math.max(1,Math.round(img.height*f));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.72)}
async function saveDraft(){try{setStatus('正在保存…');const body={draft,revision:revision+1};const result=await request('/rest/v1/lumu_content?id=eq.main&revision=eq.'+revision+'&select=revision',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('检测到其他管理员已修改草稿；请重新载入后合并，避免覆盖');revision=result[0].revision;dirty=false;render();setStatus('管理员草稿已保存（未发布）')}catch(e){setStatus('保存失败：'+e.message)}}
async function publish(){if(dirty){alert('请先保存草稿，再发布');return}if(!confirm('确认将当前草稿发布到正式玩家端？原有已发布内容将被新版本替换，请确认已备份。'))return;try{setStatus('正在发布…');const body={published:draft,revision:revision+1,published_at:new Date().toISOString()};const result=await request('/rest/v1/lumu_content?id=eq.main&revision=eq.'+revision+'&select=revision',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('检测到版本冲突，发布取消');revision=result[0].revision;published=clone(draft);render();setStatus('成功发布到 Supabase，玩家端会在刷新后读取。请再核对前端。')}catch(e){setStatus('发布失败：'+e.message)}}
function backup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({revision,draft,published},null,2)],{type:'application/json'}));a.href=url;a.download='lumu-studio-backup-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function importLegacy(){try{const db=await new Promise((resolve,reject)=>{const req=indexedDB.open('lumu-contact-studio-v1');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!db.objectStoreNames.contains('contacts'))throw Error('没有检测到旧联系人草稿');const arr=await new Promise((resolve,reject)=>{const req=db.transaction('contacts').objectStore('contacts').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});let added=0;for(const old of arr){if(!old?.id)continue;if(old.id==='phone_owner'||old.isOwner){for(const key of ['name','nickname','wechatId','region','signature','avatar'])if(old[key]&&!wx().settings.owner[key])wx().settings.owner[key]=old[key];continue}const existing=people().find(x=>x.id===old.id);if(existing){for(const key of ['name','nickname','remark','wechatId','region','signature','avatar','notes','relationship'])if(old[key]&&!existing[key])existing[key]=old[key]}else{people().push(old);added++}}change();render();setStatus('读取 '+arr.length+' 个旧档案，新增 '+added+' 个；已存在字段不会覆盖。请保存管理员草稿。')}catch(err){setStatus('旧草稿导入失败：'+err.message)}}
function bind(){if(section==='video')bindVideo();if(section==='analytics'){loadAnalytics();if($('refreshStats'))$('refreshStats').onclick=loadAnalytics}if($('save'))$('save').onclick=saveDraft;if($('publish'))$('publish').onclick=publish;if($('backup'))$('backup').onclick=backup;if($('previewDraft'))$('previewDraft').onclick=()=>window.open('./?preview=draft&app=wechat','_blank');
document.querySelectorAll('[data-app]').forEach(el=>el.onchange=()=>{const id=el.dataset.app;let a=draft.appManager.apps.find(x=>x.id===id);if(!a){a={id,name:appCatalog.find(x=>x[0]===id)?.[1]||id};draft.appManager.apps.push(a)}a.available=el.checked;change()});
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{personId=b.dataset.person;sub='profile';render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{section=b.dataset.go;render()});document.querySelectorAll('[data-editpersona]').forEach(b=>b.onclick=()=>{personId=b.dataset.editpersona;sub='persona';section='people';render()});
if($('importLegacy'))$('importLegacy').onclick=importLegacy;
if($('addPerson'))$('addPerson').onclick=()=>{const p={id:id(),name:'新联系人',nickname:'',remark:''};people().push(p);personId=p.id;sub='profile';change();render()};
if($('savePerson'))$('savePerson').onclick=async()=>{const p=current();if(sub==='persona'){wx().personas[personId]??={};document.querySelectorAll('[data-persona]').forEach(el=>wx().personas[personId][el.dataset.persona]=el.value)}else document.querySelectorAll('[data-personfield]').forEach(el=>p[el.dataset.personfield]=el.value);change();await saveDraft();if(!dirty)setStatus('人物资料已保存到云端草稿。要在正式微信中显示，还需到「草稿与发布」确认发布。')};
if($('deletePerson'))$('deletePerson').onclick=()=>{if(personId==='owner')return;if(!confirm('仅删除联系人资料？相关聊天/朋友圈仍会保留，需单独检查后清理。'))return;wx().contacts=people().filter(x=>x.id!==personId);personId='owner';change();render()};
if($('avatarFile'))$('avatarFile').onchange=async e=>{try{current().avatar=await resizeImage(e.target.files[0],400);change();render();setStatus('头像已添加到草稿，记得保存')}catch(err){setStatus(err.message)}};
if($('wallpaperFile'))$('wallpaperFile').onchange=async e=>{try{current().chatWallpaper=await resizeImage(e.target.files[0],1080);change();render();setStatus('聊天背景已添加到人物草稿')}catch(err){setStatus(err.message)}};
if($('clearWallpaper'))$('clearWallpaper').onclick=()=>{delete current().chatWallpaper;change();render()};
for(const [add,key,editKey,kind] of [['addGroup','groups','editgroup','group'],['addMessage','messages','editmsg','message'],['addMoment','moments','editmoment','moment'],['addRule','replyRules','editrule','rule'],['addScheduled','scheduledMessages','editscheduled','scheduled']]){if($(add))$(add).onclick=()=>edit(kind,{id:'',personId:personId==='owner'?'mu_zhicheng':personId});document.querySelectorAll('[data-'+editKey+']').forEach(b=>b.onclick=()=>edit(kind,wx()[key].find(x=>x.id===b.dataset[editKey])))}
}
const s=sessionGet();if(s?.access_token){token=s.access_token;load()}else renderLogin();
</script></body></html>
