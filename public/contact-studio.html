<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuMu Studio · 微信联系人</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#1a2634;background:#f3f5fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e4e8ee;padding:18px clamp(18px,5vw,60px);display:flex;gap:16px;align-items:center;justify-content:space-between}header h1{margin:0;font-size:20px}small{color:#7c8897}.pill{background:#eef5fd;border-radius:24px;color:#42699c;padding:7px 12px;font-size:12px}.wrap{max-width:1160px;margin:24px auto;padding:0 20px}.notice{background:#fff8e7;border:1px solid #f1dbad;border-radius:14px;padding:13px 16px;font-size:13px;color:#775d26;line-height:1.6;margin-bottom:17px}.layout{display:grid;grid-template-columns:310px 1fr;gap:20px}.panel{background:#fff;border:1px solid #e7e9f1;border-radius:18px;box-shadow:0 7px 30px #273c5c0c;overflow:hidden}.panelHead{padding:18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f3}h2{font-size:16px;margin:0}.btn{border:0;border-radius:10px;background:#172d48;color:white;padding:10px 15px}.btn.light{background:#edf2f7;color:#2b415a}.btn.danger{background:#fff1ef;color:#b43e37}.search{width:calc(100% - 32px);margin:16px;border:1px solid #e3e6ef;border-radius:10px;padding:11px}.contacts{max-height:70vh;overflow:auto;padding:0 10px 15px}.contact{display:flex;align-items:center;gap:12px;width:100%;padding:11px;background:white;border:0;border-radius:12px;text-align:left}.contact:hover,.contact.active{background:#eef4ff}.avatar{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#dde5ee;display:grid;place-items:center;flex-shrink:0;font-size:21px;color:#627da1}.sub{font-size:12px;color:#8b97a6;margin-top:4px}.empty{padding:40px 16px;text-align:center;color:#8b97a6}.editor{padding:22px}.uploadRow{display:flex;align-items:center;gap:19px;margin-bottom:25px}.preview{width:90px;height:90px;border-radius:19px;object-fit:cover;background:#e6edf3}.uploadBtn{display:inline-block;background:#eef3fa;padding:10px 13px;border-radius:10px;cursor:pointer;font-size:13px}.uploadBtn input{display:none}.help{display:block;color:#929aa7;font-size:12px;margin-top:7px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:550}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5ed;border-radius:9px;padding:11px;outline:none;background:#fff;color:#182638}.field textarea{min-height:87px;resize:vertical}.field.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px;align-items:center}.tip{font-size:12px;color:#768696}.settings{padding:15px 22px 22px;border-top:1px solid #eef1f4;margin-top:20px}.settings h3{font-size:14px;margin:4px 0 9px}.settings p{font-size:13px;color:#647486;line-height:1.65}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#162e43;color:white;padding:11px 20px;border-radius:12px;display:none}@media(max-width:740px){.layout{grid-template-columns:1fr}.contacts{max-height:270px}.fields{grid-template-columns:1fr}.editor{padding:16px}header{align-items:flex-start}.uploadRow{flex-wrap:wrap}}
</style></head><body>
<header><div><small>LuMu Studio / 微信管理中心</small><h1>联系人独立档案</h1></div><span class="pill">V1 · 本地草稿</span></header>
<div class="wrap"><div class="notice"><strong>开发预览版：</strong>头像可从电脑或手机相册直接上传，每位联系人独立保存。当前草稿仅保存在此浏览器，不会修改正式游戏、Supabase 数据或其他玩家资料。正式云端保存、权限管理和发布同步在下一阶段接入。</div>
<div class="layout"><aside class="panel"><div class="panelHead"><h2>联系人 <span id="count">0</span></h2><button class="btn" id="add">＋ 新增</button></div><input class="search" id="search" placeholder="搜索昵称、姓名或备注"><div class="contacts" id="list"></div></aside>
<main class="panel"><div class="panelHead"><h2 id="heading">联系人资料</h2><small>独立资料管理</small></div><div class="editor" id="editor"><div class="empty">选择联系人，或点击“新增”建立档案</div></div>
<div class="settings"><h3>后续拓展</h3><p>每位联系人未来会关联独立的人设、与机主关系、聊天记录、朋友圈、自动回复及剧情触发器。此次只建立基础档案结构，不预设任何人物剧情。</p></div></main></div>
<div class="actions"><button class="btn light" id="export">导出草稿 JSON（不含头像）</button><button class="btn light" id="exportAll">导出完整备份（含头像）</button><label class="uploadBtn">导入完整备份<input type="file" id="import" accept=".json,application/json"></label><span class="tip">导出文件建议单独备份，避免浏览器清理导致数据丢失。</span></div>
</div><div id="toast" class="toast"></div>
<script>
const DB='lumu-contact-studio-v1',STORE='contacts';let db,contacts=[],selected=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>globalThis.crypto?.randomUUID?.()||'c-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=()=>new Promise((res,rej)=>{const t=db.transaction(STORE).objectStore(STORE).getAll();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)});
const save=x=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);t.onsuccess=res;t.onerror=()=>rej(t.error)});
const remove=id=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);t.onsuccess=res;t.onerror=()=>rej(t.error)});
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}
const fallback=x=>'<span class="avatar">'+esc((x.remark||x.nickname||x.name||'?')[0])+'</span>';
const pic=x=>x.avatar?'<img class="avatar" src="'+esc(x.avatar)+'" alt="">':fallback(x);
function refresh(){const q=$('search').value.trim().toLowerCase();$('count').textContent=contacts.length;const filtered=contacts.filter(x=>[x.name,x.nickname,x.remark].some(a=>String(a||'').toLowerCase().includes(q)));$('list').innerHTML=filtered.length?filtered.map(x=>'<button class="contact '+(selected===x.id?'active':'')+'" data-id="'+esc(x.id)+'">'+pic(x)+'<span><strong>'+esc(x.remark||x.nickname||x.name||'未命名')+'</strong><div class="sub">'+esc(x.name||'')+'</div></span></button>').join(''):'<div class="empty">暂无联系人</div>';$('list').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;refresh();render()})}
function render(){const x=contacts.find(c=>c.id===selected);if(!x){$('editor').innerHTML='<div class="empty">选择联系人，或点击“新增”建立档案</div>';return} $('heading').textContent=x.remark||x.nickname||x.name||'新联系人';
$('editor').innerHTML='<div class="uploadRow">'+(x.avatar?'<img class="preview" src="'+esc(x.avatar)+'" alt="当前头像">':'<span class="avatar" style="width:90px;height:90px">'+esc((x.name||'?')[0])+'</span>')+'<div><label class="uploadBtn">上传 / 更换头像<input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="help">JPG、PNG、WebP；自动裁切为正方形，最大 3 MB。</span></div></div><div class="fields">'+
[['name','真实姓名'],['nickname','微信昵称'],['remark','微信备注'],['wechatId','微信号'],['phone','模拟电话号码'],['region','地区'],['birthday','生日'],['tags','联系人标签'],['signature','个性签名'],['relationship','与机主的关系'],['notes','人物资料补充']].map(([key,label])=>'<label class="field '+(['signature','relationship','notes'].includes(key)?'wide':'')+'">'+label+(['signature','relationship','notes'].includes(key)?'<textarea data-field="'+key+'">'+esc(x[key]||'')+'</textarea>':'<input data-field="'+key+'" value="'+esc(x[key]||'')+'" '+(key==='birthday'?'placeholder="例如 11-16"':'')+'>')+'</label>').join('')+'</div><div class="actions"><button class="btn" id="save">保存联系人草稿</button><button class="btn danger" id="delete">删除联系人</button><span class="tip">当前仅本地保存，不会发布至游戏</span></div>';
$('save').onclick=async()=>{const updated={...x,updatedAt:new Date().toISOString()};$('editor').querySelectorAll('[data-field]').forEach(el=>updated[el.dataset.field]=el.value);await save(updated);contacts=await all();refresh();render();toast('联系人草稿已保存')};
$('delete').onclick=async()=>{if(!confirm('确认删除这位联系人的本地草稿吗？'))return;await remove(x.id);contacts=await all();selected=contacts[0]?.id||null;refresh();render();toast('本地草稿已删除')};
$('avatarFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>3*1024*1024){toast('请选择 3 MB 以内的图片');return}try{const bmp=await createImageBitmap(file),canvas=document.createElement('canvas'),size=512;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d'),crop=Math.min(bmp.width,bmp.height);ctx.drawImage(bmp,(bmp.width-crop)/2,(bmp.height-crop)/2,crop,crop,0,0,size,size);const updated={...x,avatar:canvas.toDataURL('image/jpeg',.86),updatedAt:new Date().toISOString()};await save(updated);contacts=await all();refresh();render();toast('头像上传并保存成功')}catch(err){toast('上传失败，请更换图片重试')}}}
$('add').onclick=async()=>{const x={id:uuid(),name:'',nickname:'',remark:'',avatar:'',updatedAt:new Date().toISOString()};await save(x);contacts=await all();selected=x.id;refresh();render();toast('已创建独立联系人草稿')};$('search').oninput=refresh;
function download(data,name){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('export').onclick=()=>download(contacts.map(({avatar,...rest})=>rest),'lumu-contacts-'+new Date().toISOString().slice(0,10)+'.json');
$('exportAll').onclick=()=>download({format:'lumu-contacts-v1',contacts},'lumu-contacts-full-'+new Date().toISOString().slice(0,10)+'.json');
$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());const arr=Array.isArray(raw)?raw:raw.contacts;if(!Array.isArray(arr))throw Error('格式不对');if(arr.length>500)throw Error('最多 500 条');for(const item of arr){if(!item||typeof item!=='object')continue;const clean={};for(const key of ['id','name','nickname','remark','wechatId','phone','region','birthday','tags','signature','relationship','notes','avatar','updatedAt'])if(typeof item[key]==='string')clean[key]=item[key];clean.id=clean.id||uuid();if(clean.avatar&&!/^data:image\/(png|jpeg|webp);base64,/.test(clean.avatar))delete clean.avatar;await save(clean)}contacts=await all();selected=contacts[0]?.id||null;refresh();render();toast('已导入联系人草稿')}catch(err){toast('导入失败：'+err.message)}};
open().then(async d=>{db=d;contacts=await all();selected=contacts[0]?.id||null;refresh();render()}).catch(()=>toast('此浏览器不支持本地存储，请更换浏览器'));
</script></body></html>
