function renderLogin(message=''){document.getElementById('root').innerHTML='<div class="panel login"><h2>管理员登录</h2><p class="hint">使用此项目 Supabase 中具有 admin 权限的账号登录。浏览器只在本次标签会话保存登录令牌。</p><label class="field">邮箱<input type="email" id="email" autocomplete="username"></label><label class="field">密码<input type="password" id="password" autocomplete="current-password"></label><button class="primary" id="signin">登录后台</button><p id="loginError" class="status">'+esc(message)+'</p></div>';$('state').textContent='未登录';$('signin').onclick=async()=>{try{$('signin').disabled=true;const res=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=res.access_token;sessionStorage.setItem(SESSION,JSON.stringify(res));await load()}catch(e){$('loginError').textContent=e.message;$('signin').disabled=false}}}

function renderPersonTab(){const p=current()||{},id=personId;if(sub==='content')return '<div class="note">所有聊天、朋友圈、自动回复都通过当前人物 ID '+esc(id)+' 关联，修改备注或头像不会更改其 ID。</div><div class="actions"><button class="secondary" data-go="messages">编辑聊天记录</button><button class="secondary" data-go="moments">编辑朋友圈动态</button><button class="secondary" data-go="rules">主动消息与规则</button></div>';
if(sub==='persona'){const data=wx().personas[id]||{};return '<p class="note">这里保存后续 AI 自由回复需要的人物上下文；当前不调用 AI，也不会自动凭空编造现实关系。</p><div class="formgrid">'+[['identity','人物身份'],['personality','性格特征'],['speechStyle','语言习惯'],['knownFacts','已知事实'],['unknownFacts','未知事实 / 不得提前得知'],['boundaries','话题禁忌 / 剧情边界'],['relationship','与机主关系'],['examples','示例对话']].map(([k,v])=>'<label class="field">'+v+'<textarea data-persona="'+k+'">'+esc(data[k]||'')+'</textarea></label>').join('')+'</div><button class="secondary" id="savePerson">保存人物 AI 设定草稿</button>'}
if(sub==='wallpaper')return '<p class="note">壁纸优先保存在本人物的配置下。该图片与手机桌面/锁屏完全独立；当前玩家端也支持自行设置独立的本地聊天背景。</p><div class="upload">'+(p.chatWallpaper?'<img class="preview" src="'+esc(p.chatWallpaper)+'">':'<span class="face">图片</span>')+'<input type="file" accept="image/png,image/jpeg,image/webp" id="wallpaperFile"><button class="secondary" id="clearWallpaper">清除</button></div>';
return '<div class="upload">'+(p.avatar?'<img src="'+esc(p.avatar)+'">':'<span class="face">头像</span>')+'<label class="field">上传头像<input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp"></label></div><div class="formgrid">'+[['name','姓名'],['nickname','微信昵称'],['remark','备注'],['wechatId','微信号'],['region','地区'],['signature','个性签名'],['relationship','与机主关系'],['notes','补充设定']].map(([k,v])=>'<label class="field">'+v+'<input data-personfield="'+k+'" value="'+esc(p[k]||'')+'"></label>').join('')+'</div><div class="actions"><button class="primary" id="savePerson">保存人物资料</button>'+(id==='owner'?'':'<button class="danger" id="deletePerson">删除该联系人</button>')+'</div>'}
function renderGroups(){return layout('<div class="actions"><button class="primary" id="addGroup">＋ 新建群聊</button><button class="secondary" id="save">保存草稿</button></div><div class="rows">'+wx().groups.map(g=>'<div class="row"><div><b>'+esc(g.name)+'</b><small>'+esc((g.members||[]).join(' / '))+'</small></div><button data-editgroup="'+esc(g.id)+'" class="secondary">编辑</button></div>').join('')+'</div><div id="editArea"></div>','微信群聊管理')}
function renderMessages(){return layout('<p class="note">预设聊天记录写入管理员内容层，不会清理玩家自行发送的消息。</p><div class="actions"><button class="primary" id="addMessage">＋ 新增消息</button><button class="secondary" id="save">保存草稿</button></div><div class="rows">'+wx().messages.map(m=>'<div class="row"><aside><b>'+esc(m.personId)+' · '+esc(m.sender)+'</b><small>'+esc(m.content?.slice(0,100)||'')+'</small></aside><button class="secondary" data-editmsg="'+esc(m.id)+'">编辑</button></div>').join('')+'</div><div id="editArea"></div>','聊天记录编辑器')}
function renderMoments(){return layout('<p class="note">朋友圈动态按 authorId 关联机主或联系人；支持上传图片、编辑正文、发布时间。</p><div class="actions"><button class="primary" id="addMoment">＋ 新增动态</button><button class="secondary" id="save">保存草稿</button></div><div class="rows">'+wx().moments.map(m=>'<div class="row"><aside><b>'+esc(m.authorId)+' · '+esc((m.text||'无文字').slice(0,50))+'</b><small>'+esc(m.time||'')+'</small></aside><button data-editmoment="'+esc(m.id)+'" class="secondary">编辑</button></div>').join('')+'</div><div id="editArea"></div>','朋友圈管理')}
function renderPersonas(){return layout('<p class="note">每位人物拥有独立的 AI 人设、已知事实和禁止透露的信息。之后由安全服务端接入模型，模型密钥不放在 GitHub 前端。</p><div class="rows">'+[{id:'owner',...wx().settings.owner},...people()].map(p=>'<div class="row"><span>'+esc(labelperson(p))+'</span><button class="secondary" data-editpersona="'+esc(p.id)+'">编辑独立人设</button></div>').join('')+'</div>','AI 人设中心')}
function renderRules(){return layout('<p class="note">主动消息可按延时（delayMs）或日期时间（at）触发；回复规则按联系人关键词匹配。当前为确定性规则，并非真实 AI 自由聊天。</p><div class="actions"><button class="primary" id="addRule">＋ 关键词回复</button><button class="secondary" id="addScheduled">＋ 主动消息</button><button class="secondary" id="save">保存草稿</button></div><div class="rows">'+wx().replyRules.map(r=>'<div class="row"><aside><b>回复 · '+esc(r.personId)+' · '+esc(r.trigger)+'</b><small>'+esc(r.reply)+'</small></aside><button data-editrule="'+esc(r.id)+'" class="secondary">编辑</button></div>').join('')+wx().scheduledMessages.map(r=>'<div class="row"><aside><b>主动 · '+esc(r.personId)+'</b><small>'+esc(r.content)+'</small></aside><button data-editscheduled="'+esc(r.id)+'" class="secondary">编辑</button></div>').join('')+'</div><div id="editArea"></div>','消息与自动回复')}
function renderRelease(){return layout('<p class="note">管理员草稿与正式玩家内容完全隔离。发布会整体更新当前内容快照并保留原有未编辑字段，不清除玩家个人消息。发布前请下载备份。</p><div class="row"><div><strong>数据库内容版本</strong><small>revision '+revision+'</small></div><span class="pill">'+(dirty?'待保存':'已保存')+'</span></div><div class="actions"><button class="primary" id="save">保存草稿</button><button class="secondary" id="previewDraft">预览微信草稿</button><button class="secondary" id="backup">导出完整草稿 JSON</button><button class="danger" id="publish">发布到正式游戏</button></div>','版本与发布')}

function edit(kind,obj){const fields=kind==='group'?[['name','群聊名称'],['members','成员 ID（英文逗号分隔）']]:kind==='message'?[['personId','所属联系人/群聊 ID'],['sender','发言人（owner/contact）'],['type','类型（text/image）'],['content','消息内容'],['time','发送时间 ISO']]:kind==='moment'?[['authorId','发布人物 ID'],['text','文字内容'],['time','时间'],['imageUrl','图片 URL']]:kind==='rule'?[['personId','联系人 ID'],['trigger','关键词'],['reply','回复文本'],['delayMs','延迟毫秒']]:[['personId','联系人 ID'],['content','消息正文'],['trigger','触发模式（delay/at）'],['delayMs','延迟毫秒'],['at','指定时间（ISO）']];
$('editArea').innerHTML='<div class="note"><b>'+esc(obj.id?'编辑':'新增')+'</b> · 编辑后保存到草稿，不会立即发布</div><div class="formgrid">'+fields.map(([k,label])=>'<label class="field">'+label+'<input data-edit="'+k+'" value="'+esc(k==='members'&&Array.isArray(obj[k])?obj[k].join(','):obj[k]||'')+'"></label>').join('')+'</div>'+(kind==='moment'?'<label class="field">上传动态图片<input type="file" id="momentImage" accept="image/*"></label>':'')+'<div class="actions"><button id="commitEdit" class="primary">保存该条</button><button id="removeEdit" class="danger">删除</button></div>';
if(kind==='moment')$('momentImage').onchange=async e=>{try{obj.imageUrl=await resizeImage(e.target.files?.[0],960)}catch(err){alert(err.message)}};

async function resizeImage(file,limit=450){if(!file)throw Error('没有选择照片');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('只能上传图片');if(file.size>8e6)throw Error('图片不能大于 8 MB');const img=await createImageBitmap(file);const f=Math.min(1,limit/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*f));cv.height=Math.max(1,Math.round(img.height*f));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.72)}
async function saveDraft(){try{setStatus('正在保存…');const body={draft,revision:revision+1};const result=await request('/rest/v1/lumu_content?id=eq.main&revision=eq.'+revision+'&select=revision',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('检测到其他管理员已修改草稿；请重新载入后合并，避免覆盖');revision=result[0].revision;dirty=false;render();setStatus('管理员草稿已保存（未发布）')}catch(e){setStatus('保存失败：'+e.message)}}
async function publish(){if(dirty){alert('请先保存草稿，再发布');return}if(!confirm('确认将当前草稿发布到正式玩家端？原有已发布内容将被新版本替换，请确认已备份。'))return;try{setStatus('正在发布…');const body={published:draft,revision:revision+1,published_at:new Date().toISOString()};const result=await request('/rest/v1/lumu_content?id=eq.main&revision=eq.'+revision+'&select=revision',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('检测到版本冲突，发布取消');revision=result[0].revision;published=clone(draft);render();setStatus('成功发布到 Supabase，玩家端会在刷新后读取。请再核对前端。')}catch(e){setStatus('发布失败：'+e.message)}}
function backup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({revision,draft,published},null,2)],{type:'application/json'}));a.href=url;a.download='lumu-studio-backup-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function bind(){if($('save'))$('save').onclick=saveDraft;if($('publish'))$('publish').onclick=publish;if($('backup'))$('backup').onclick=backup;if($('previewDraft'))$('previewDraft').onclick=()=>window.open('./?preview=draft&app=wechat','_blank');
document.querySelectorAll('[data-app]').forEach(el=>el.onchange=()=>{const id=el.dataset.app;let a=draft.appManager.apps.find(x=>x.id===id);if(!a){a={id,name:appCatalog.find(x=>x[0]===id)?.[1]||id};draft.appManager.apps.push(a)}a.available=el.checked;change()});
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{personId=b.dataset.person;sub='profile';render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{section=b.dataset.go;render()});document.querySelectorAll('[data-editpersona]').forEach(b=>b.onclick=()=>{personId=b.dataset.editpersona;sub='persona';section='people';render()});
if($('addPerson'))$('addPerson').onclick=()=>{const p={id:id(),name:'新联系人',nickname:'',remark:''};people().push(p);personId=p.id;sub='profile';change();render()};
if($('savePerson'))$('savePerson').onclick=()=>{const p=current();if(sub==='persona'){wx().personas[personId]??={};document.querySelectorAll('[data-persona]').forEach(el=>wx().personas[personId][el.dataset.persona]=el.value)}else document.querySelectorAll('[data-personfield]').forEach(el=>p[el.dataset.personfield]=el.value);change();render();setStatus('人物字段已更新，请点击顶部“保存草稿”写入云端')};
if($('deletePerson'))$('deletePerson').onclick=()=>{if(personId==='owner')return;if(!confirm('仅删除联系人资料？相关聊天/朋友圈仍会保留，需单独检查后清理。'))return;wx().contacts=people().filter(x=>x.id!==personId);personId='owner';change();render()};
if($('avatarFile'))$('avatarFile').onchange=async e=>{try{current().avatar=await resizeImage(e.target.files[0],400);change();render();setStatus('头像已添加到草稿，记得保存')}catch(err){setStatus(err.message)}};
if($('wallpaperFile'))$('wallpaperFile').onchange=async e=>{try{current().chatWallpaper=await resizeImage(e.target.files[0],1080);change();render();setStatus('聊天背景已添加到人物草稿')}catch(err){setStatus(err.message)}};
if($('clearWallpaper'))$('clearWallpaper').onclick=()=>{delete current().chatWallpaper;change();render()};
for(const [add,key,editKey,kind] of [['addGroup','groups','editgroup','group'],['addMessage','messages','editmsg','message'],['addMoment','moments','editmoment','moment'],['addRule','replyRules','editrule','rule'],['addScheduled','scheduledMessages','editscheduled','scheduled']]){if($(add))$(add).onclick=()=>edit(kind,{id:'',personId:personId==='owner'?'mu_zhicheng':personId});document.querySelectorAll('[data-'+editKey+']').forEach(b=>b.onclick=()=>edit(kind,wx()[key].find(x=>x.id===b.dataset[editKey])))}
}
const s=sessionGet();if(s?.access_token){token=s.access_token;load()}else renderLogin();
</script></body></html>
