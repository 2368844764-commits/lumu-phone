<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuMu Studio · 独立 APP 管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#252938;font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e5e8f0;padding:17px max(20px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:19px}a{color:#345bc6;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:20px}.notice{background:#fff6e4;color:#80591b;border-radius:12px;padding:13px 16px;font-size:13px;line-height:1.6;margin-bottom:18px}.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:14px}.sidebar,.panel{background:#fff;border:1px solid #e4e7ef;border-radius:18px;padding:17px;min-width:0}.sidebar h3{margin:0 0 14px}.app{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:1px solid transparent;border-radius:12px;background:#fff;text-align:left;margin-bottom:5px}.app.active{background:#eaf0ff;border-color:#b8c8fa}.app .meta{flex:1;min-width:0}.app small{display:block;color:#7c8290;margin-top:4px}.app-icon{width:44px;height:44px;border-radius:12px;background:#e9eaf0;display:grid;place-items:center;font-size:25px;flex-shrink:0;overflow:hidden}.app-icon img{width:100%;height:100%;object-fit:cover}h2{margin:0 0 8px}p{line-height:1.6}.muted{color:#777f90}.tabs{display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid #e9eaf0;padding-bottom:13px;margin:18px 0}.tabs button,.smallbtn{border:1px solid #dce1eb;border-radius:9px;background:#fff;padding:8px 12px}.tabs button.active{background:#e8efff;border-color:#99b3f5;color:#3159b3}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #dce1e9;border-radius:9px;padding:11px;background:#fff;color:#252938}textarea{min-height:100px;resize:vertical}.btn{border:0;background:#4466d9;color:white;border-radius:10px;padding:11px 17px;margin-top:17px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #e8ebf1;border-radius:12px;padding:12px;margin-top:10px}.item small{display:block;color:#838996;margin-top:5px;overflow-wrap:anywhere}.item button{border:1px solid #e4e7ed;background:white;border-radius:8px;padding:7px 10px}.empty{background:#f7f8fb;border-radius:12px;padding:20px;color:#838995}.footer{margin-top:20px;color:#8790a0;font-size:12px}.preview-pane{background:#fff;border:1px solid #e4e7ef;border-radius:18px;padding:12px;min-width:0;position:sticky;top:10px;align-self:start}.preview-pane iframe{width:100%;height:640px;border:0;border-radius:12px;background:#eee}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.layout{grid-template-columns:200px 1fr}.preview-pane{grid-column:1/-1;position:static}.preview-pane iframe{height:650px;max-width:420px;display:block;margin:auto}}@media(max-width:740px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;gap:6px;align-items:center}.sidebar h3{display:none}.app{min-width:160px}.two{grid-template-columns:1fr}header{padding:15px}.wrap{padding:12px}}
</style></head><body><header><div><b>LuMu Studio · 独立 APP 管理</b><div class="muted">每个 APP 独立设置名称、图标、页面与内容</div></div><a href="./">← 返回原后台</a></header><main class="wrap"><div class="notice">这是独立 APP 管理的本机草稿版。所有修改仅保存在当前浏览器，在此编辑保存后可立即在右侧预览；正式玩家内容需返回后台上传并发布。请定期导出 JSON 备份，不要输入真实私人数据。</div><div class="layout"><aside class="sidebar" id="apps"></aside><section class="panel"><div id="editor"></div></section><aside class="preview-pane"><b>📱 玩家端实时预览</b><div class="row" style="margin-top:8px"><button class="smallbtn" id="previewApp" type="button">当前 APP</button><button class="smallbtn" id="previewPhone" type="button">完整手机</button></div><p class="muted" style="font-size:12px">编辑并保存后自动刷新预览。使用与玩家相同的游戏页面；默认直接进入当前 APP；切换完整手机可从锁屏体验。</p><iframe title="真实游戏预览" src="../?preview=local&app=wechat" id="previewFrame"></iframe></aside></div><div class="footer">本页面与现有六个后台模块隔离；不会覆盖原有微信草稿或玩家数据。</div></main><script>
const KEY='lumu-app-manager-v1';
const presets=[['wechat','微信','💬','dock'],['phone','电话','📞','dock'],['photos','照片','🌸','home'],['notes','备忘录','📝','home'],['countdown','倒数日','📅','home'],['messages','信息','✉️','dock'],['tfamily','T-FAMILY','✨','home'],['settings','设置','⚙️','home']];
const initial=()=>({apps:presets.map(([id,name,emoji,placement])=>({id,name,emoji,placement,iconUrl:'',enabled:true,pages:id==='wechat'?['微信','通讯录','发现','我']:[]})),wechat:{contacts:[],messages:[],moments:[],calls:[]}});
let data=initial();try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.apps)&&x.wechat)data=x}catch(e){console.warn(e)}
for(const k of ['contacts','messages','moments','calls'])if(!Array.isArray(data.wechat[k]))data.wechat[k]=[];
let selected=data.apps[0]?.id||'wechat',tab='basic',previewKind='app';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存失败：'+e.message);return false}}
function field(name,label,value='',type='text'){return '<label>'+esc(label)+'</label><input name="'+esc(name)+'" type="'+type+'" value="'+esc(value)+'">'}
function select(name,label,options){return '<label>'+esc(label)+'</label><select name="'+esc(name)+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('')+'</select>'}
function area(name,label){return '<label>'+esc(label)+'</label><textarea name="'+esc(name)+'"></textarea>'}
function records(arr,kind,render){return arr.length?arr.map((x,i)=>'<div class="item"><div><b>'+esc(render(x))+'</b></div><button data-delete="'+kind+'" data-index="'+i+'">删除</button></div>').join(''):'<p class="empty">还没有内容，使用上方表单添加。</p>'}
function updatePreview(){const f=$('previewFrame');if(!f)return;const id=previewKind==='phone'?'phone':selected;const u=new URL('../',location.href);u.searchParams.set('preview','local');u.searchParams.set('app',id);if(f.dataset.current!==id){f.dataset.current=id;f.src=u.href}}$('previewApp').onclick=()=>{previewKind='app';updatePreview()};$('previewPhone').onclick=()=>{previewKind='phone';updatePreview()};
function draw(){if(!data.apps.some(x=>x.id===selected))selected=data.apps[0]?.id||'';const app=data.apps.find(x=>x.id===selected);$('apps').innerHTML='<h3>手机 APP</h3>'+data.apps.map(a=>'<button class="app '+(a.id===selected?'active':'')+'" data-app="'+esc(a.id)+'"><span class="app-icon">'+(a.iconUrl?'<img alt="" src="'+esc(a.iconUrl)+'">':esc(a.emoji||'📱'))+'</span><span class="meta"><b>'+esc(a.name)+'</b><small>'+esc(a.enabled?'已显示':'已隐藏')+' · '+esc(a.placement)+'</small></span></button>').join('')+'<button class="smallbtn" data-new="1">＋ 新建 APP</button><button class="smallbtn" data-backup="1">导出备份</button><button class="smallbtn" data-import="1">导入备份</button><input id="importfile" type="file" accept=".json" hidden>';
if(!app){$('editor').innerHTML='<p>请选择或创建 APP</p>';return}updatePreview();
const isWx=app.id==='wechat';const tabs=[['basic','基础信息'],['pages','内部页面'],...(isWx?[['contacts','微信通讯录'],['messages','微信聊天'],['moments','朋友圈'],['calls','微信通话']]:[])];if(!tabs.some(x=>x[0]===tab))tab='basic';
let out='<h2>'+esc(app.name)+' · 编辑器</h2><p class="muted">独立 APP 配置草稿。内容暂不影响线上游戏。</p><div class="tabs">'+tabs.map(([k,v])=>'<button data-tab="'+k+'" class="'+(k===tab?'active':'')+'">'+v+'</button>').join('')+'</div>';
if(tab==='basic')out+='<form data-form="basic">'+field('name','APP 显示名称',app.name)+field('emoji','默认图标（Emoji）',app.emoji)+field('iconUrl','自定义图标 HTTPS 图片链接',app.iconUrl,'url')+select('placement','桌面位置',[['home','主屏幕'],['dock','底部 Dock']])+select('enabled','显示状态',[['true','显示'],['false','隐藏']])+'<button class="btn">保存 APP 设置</button></form><div class="row"><button class="smallbtn" data-move="-1">上移排序</button><button class="smallbtn" data-move="1">下移排序</button>'+(presets.some(x=>x[0]===app.id)?'':'<button class="smallbtn" data-removeapp="1">删除此 APP</button>')+'</div>';
else if(tab==='pages')out+='<p class="muted">可设置 APP 内部页面及显示顺序。具体交互需在玩家端实现。</p><form data-form="page">'+field('title','新增内部页面名称')+'<button class="btn">添加页面</button></form>'+records(app.pages||[],'page',x=>x);
else if(tab==='contacts')out+='<form data-form="contact">'+field('name','联系人姓名')+field('remark','微信备注')+field('avatar','头像 HTTPS 链接')+'<button class="btn">添加联系人</button></form>'+records(data.wechat.contacts,'contacts',x=>(x.remark||x.name)+' · '+x.name);
else if(tab==='messages')out+='<form data-form="message">'+select('personId','选择聊天对象',data.wechat.contacts.length?data.wechat.contacts.map(p=>[p.id,p.remark||p.name]):[['mu_zhicheng','穆祉丞（默认）']])+select('sender','发送方',[['owner','手机主人'],['contact','对方'],['system','系统']])+select('type','消息类型',[['text','文字'],['image','图片'],['voice','语音'],['video','视频'],['call','通话记录'],['recalled','撤回提示']])+area('content','内容或素材链接')+field('time','显示时间','', 'datetime-local')+'<button class="btn">添加消息</button></form>'+records(data.wechat.messages,'messages',x=>x.personId+' · '+x.type+' · '+x.content.slice(0,45));
else if(tab==='moments')out+='<form data-form="moment">'+select('author','发布人', [['wang_lujie','王橹杰（手机主人）'],...data.wechat.contacts.map(p=>[p.id,p.remark||p.name])])+area('text','朋友圈正文')+field('imageUrl','配图 HTTPS 链接')+'<button class="btn">添加动态</button></form>'+records(data.wechat.moments,'moments',x=>x.author+' · '+x.text.slice(0,45));
else if(tab==='calls')out+='<form data-form="call">'+field('person','通话对象')+select('kind','通话类型',[['voice','微信语音'],['video','微信视频']])+select('status','通话状态',[['incoming','来电'],['outgoing','去电'],['missed','未接']])+field('duration','通话时长（秒）','0','number')+'<button class="btn">添加通话记录</button></form>'+records(data.wechat.calls,'calls',x=>x.person+' · '+x.kind+' · '+x.status);
$('editor').innerHTML=out;if(tab==='basic'){$('editor').querySelector('[name="placement"]').value=app.placement;$('editor').querySelector('[name="enabled"]').value=String(app.enabled)}}
$('apps').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.app){selected=b.dataset.app;tab='basic';draw()}else if(b.dataset.new){const name=prompt('新 APP 名称');if(!name?.trim())return;const id=prompt('唯一英文 ID（小写字母、数字、下划线）');if(!id||!/^[a-z][a-z0-9_]*$/.test(id)||data.apps.some(x=>x.id===id))return alert('ID 无效或已存在');data.apps.push({id,name:name.trim(),emoji:'📱',placement:'home',iconUrl:'',enabled:true,pages:[]});selected=id;save();draw()}else if(b.dataset.backup){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lumu-apps-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.dataset.import)$('importfile').click()});
$('apps').addEventListener('change',async e=>{if(e.target.id!=='importfile')return;try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.apps)||!x.wechat)throw Error('格式不正确');if(confirm('导入将覆盖当前 APP 草稿，继续吗？')){data=x;for(const k of ['contacts','messages','moments','calls'])if(!Array.isArray(data.wechat[k]))data.wechat[k]=[];save();draw()}}catch(err){alert('导入失败：'+err.message)}});
$('editor').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;draw();return}const app=data.apps.find(x=>x.id===selected);if(b.dataset.move){const i=data.apps.indexOf(app),j=i+Number(b.dataset.move);if(j>=0&&j<data.apps.length){[data.apps[i],data.apps[j]]=[data.apps[j],data.apps[i]];save();draw()}}else if(b.dataset.removeapp){if(confirm('删除此 APP 草稿？')){data.apps=data.apps.filter(x=>x!==app);save();draw()}}else if(b.dataset.delete){const k=b.dataset.delete,i=Number(b.dataset.index);if(!confirm('删除这条草稿？'))return;if(k==='page')app.pages.splice(i,1);else data.wechat[k].splice(i,1);save();draw()}});
$('editor').addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f).entries()),app=data.apps.find(x=>x.id===selected),type=f.dataset.form;if(type==='basic'){if(!String(v.name).trim())return alert('名称不能为空');if(v.iconUrl&&!/^https:\/\//.test(v.iconUrl))return alert('图标必须是 HTTPS 链接');Object.assign(app,{name:v.name.trim(),emoji:v.emoji||'📱',iconUrl:v.iconUrl,placement:v.placement,enabled:v.enabled==='true'})}else if(type==='page'){if(!v.title.trim())return alert('请输入页面名称');if(!Array.isArray(app.pages))app.pages=[];app.pages.push(v.title.trim())}else{const key={contact:'contacts',message:'messages',moment:'moments',call:'calls'}[type];if(!key)return;if(type==='contact'&&!v.name.trim()||type==='message'&&(!v.personId.trim()||!v.content.trim())||type==='moment'&&!v.text.trim()||type==='call'&&!v.person.trim())return alert('请填写必要内容');data.wechat[key].push({id:uid(),...v,...(type==='contact'?{id:uid()}:{} )})}save();draw()});
draw();
</script></body></html>
