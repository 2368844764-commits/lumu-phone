<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuMu Studio · 草稿工作台</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#242632}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e7e9f1;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}header small{display:block;color:#858895;margin-top:3px}a{color:#4463c9;text-decoration:none}main{max-width:1100px;margin:auto;padding:18px}.notice{background:#fff8e8;color:#795a24;padding:13px;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:16px}.layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{border:1px solid #e6e8f0;background:white;border-radius:12px;padding:13px;text-align:left}.menu button.active{background:#e9eefc;border-color:#9db2ec;color:#2c4d9a;font-weight:700}.panel{background:white;border:1px solid #eceef3;border-radius:17px;padding:20px;min-height:400px}h2{font-size:20px;margin:0 0 8px}.muted{color:#858895;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #dfe2eb;border-radius:10px;padding:11px;background:white;color:#242632}textarea{min-height:90px;resize:vertical}.btn{border:0;background:#4165d6;color:white;border-radius:10px;padding:11px 15px;margin:12px 8px 0 0}.secondary{background:#eef1f8;color:#3c4665}.danger{background:#fff0f0;color:#9a3535}.item{border:1px solid #e8eaf0;border-radius:12px;padding:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{display:block;color:#888;margin-top:4px}.item button{border:0;background:#fff0f0;color:#a33;border-radius:8px;padding:7px 10px}.empty{padding:18px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:12px;margin-top:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#777;line-height:1.7}.pill{font-size:11px;background:#eef1f7;border-radius:50px;padding:5px 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.toolbar button{border:1px solid #e0e4ed;border-radius:9px;padding:9px 12px;background:white}.phone{width:185px;height:310px;border:7px solid #222;border-radius:30px;background:linear-gradient(145deg,#f6d5e7,#aabcf0);margin:16px auto;padding:30px 12px;text-align:center}.phone strong{font-size:30px}.phone small{display:block}.hidden{display:none}@media(max-width:700px){main{padding:12px}.layout{display:block}.menu{flex-direction:row;overflow:auto;padding-bottom:10px;margin-bottom:8px}.menu button{white-space:nowrap;flex-shrink:0;padding:11px}.panel{padding:16px;min-height:400px}.row{grid-template-columns:1fr}header{padding:14px}}</style></head><body><header><div><b>LuMu Studio</b><small>手机优先 · 本机草稿工作台</small></div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a href="./apps.html" style="font-weight:700">🧩 独立 APP 管理 →</a><a href="../">试玩游戏 ↗</a></div></header><main><div class="notice"><b>当前是本机草稿编辑器，并非正式管理后台。</b>草稿只保存在当前浏览器，尚未同步游戏或云端；请定期导出备份。不要在这里填写真实密码、私人聊天或敏感资料。</div><div class="layout"><nav class="menu" id="menu"></nav><section class="panel"><div id="content"></div></section></div></main><script>
const key='lumu-studio-draft-v1',sections=[['appearance','⚙️ 手机设置'],['people','👥 人物与联系人'],['apps','🧩 独立 APP 管理'],['chats','💬 微信消息'],['events','✨ 剧情与彩蛋'],['assets','🖼️ 素材管理'],['analytics','📊 玩家数据中心'],['versions','🕓 草稿与备份']];
const initial={appearance:{wallpaper:'',title:'LuMu',theme:'#f2a4c9'},people:[{id:'wang_lujie',name:'王橹杰',remark:'',role:'手机主人'},{id:'mu_zhicheng',name:'穆祉丞',remark:'',role:'主线联系人'}],chats:[],events:[]};
let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)};if(!data||typeof data!=='object')data=structuredClone(initial);if(!data.appearance||typeof data.appearance!=='object')data.appearance=structuredClone(initial.appearance);for(const k of ['people','chats','events'])if(!Array.isArray(data[k]))data[k]=structuredClone(initial[k]);data.appearance={...initial.appearance,...data.appearance};let section='appearance';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));alert('草稿已保存到当前浏览器（尚未发布到游戏）')}catch(e){alert('保存失败：'+e.message)}};const val=id=>document.getElementById(id)?.value.trim()||'';const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const redraw=()=>{document.getElementById('menu').innerHTML=sections.map(([id,name])=>'<button class="'+(section===id?'active':'')+'" data-section="'+id+'">'+name+'</button>').join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;redraw()});const c=document.getElementById('content');if(section==='apps'){c.innerHTML='<h2>独立 APP 管理</h2><p class="muted">在这里管理 APP 图标、名称、内部页面及微信内容；目前为本机草稿，尚未同步玩家端。</p><iframe title="APP 编辑器" src="./apps.html" style="width:100%;height:780px;border:1px solid #e7e9f1;border-radius:14px;background:#fff"></iframe>'}else if(section==='analytics'){c.innerHTML='<h2>玩家数据中心</h2><p class="muted">此模块已纳入开发计划，尚未接入匿名游玩数据，暂不展示虚构统计。</p>'}else if(section==='appearance'){c.innerHTML='<h2>手机设置 · 外观草稿</h2><p class="muted">设置游戏标题、主题颜色和壁纸链接；暂不影响玩家端。</p><label>游戏标题</label><input id="title" value="'+esc(data.appearance.title)+'"><label>主题颜色</label><input id="theme" type="color" value="'+esc(data.appearance.theme)+'"><label>壁纸图片链接（HTTPS）</label><input id="wallpaper" placeholder="https://..." value="'+esc(data.appearance.wallpaper)+'"><div class="phone" id="preview"><small>10月21日</small><strong>16:20</strong><small>手机外观预览</small></div><button class="btn" id="saveAppearance">保存外观草稿</button>';const p=document.getElementById('preview');if(data.appearance.wallpaper)p.style.background='center / cover url("'+encodeURI(data.appearance.wallpaper).replace(/"/g,'%22')+'")';const extra=document.createElement('div');extra.innerHTML='<label>桌面壁纸 HTTPS 链接</label><input id="homeWallpaper" placeholder="https://..." value="'+esc(data.appearance.homeWallpaper||'')+'"><label>模拟时区</label><select id="timezone"><option value="Asia/Shanghai">上海 / 北京</option><option value="Asia/Tokyo">东京</option><option value="America/Los_Angeles">洛杉矶</option><option value="America/New_York">纽约</option><option value="Europe/London">伦敦</option><option value="UTC">UTC</option></select><label>时间格式</label><select id="timeFormat"><option value="24">24 小时</option><option value="12">12 小时</option></select><label>锁屏时间颜色</label><input id="clockColor" type="color" value="'+esc(data.appearance.clockColor||'#f2a4c9')+'">';document.getElementById('saveAppearance').before(extra);document.getElementById('timezone').value=data.appearance.timezone||'Asia/Shanghai';document.getElementById('timeFormat').value=data.appearance.timeFormat||'24';document.getElementById('saveAppearance').onclick=()=>{data.appearance={...data.appearance,title:val('title'),theme:val('theme'),wallpaper:val('wallpaper'),homeWallpaper:val('homeWallpaper'),timezone:val('timezone'),timeFormat:val('timeFormat'),clockColor:val('clockColor')};save();redraw()}}else if(section==='people'){c.innerHTML='<h2>人物与联系人</h2><p class="muted">人物 ID 固定不变；备注可以随时修改。主线角色不会因为修改备注而变成新联系人。</p><label>人物姓名</label><input id="personName" placeholder="输入人物姓名"><label>微信备注</label><input id="personRemark" placeholder="可留空"><button class="btn" id="addPerson">新增人物草稿</button><div id="items"></div>';document.getElementById('addPerson').onclick=()=>{if(!val('personName'))return alert('请填写姓名');data.people.push({id:uid(),name:val('personName'),remark:val('personRemark'),role:'联系人'});save();redraw()};document.getElementById('items').innerHTML=data.people.map((p,i)=>'<div class="item"><div><b>'+esc(p.name)+'</b><small>'+esc(p.role)+' · 微信备注：'+esc(p.remark||'未设置')+'</small></div><button data-edit="'+i+'">编辑</button></div>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=data.people[+b.dataset.edit],next=prompt('修改微信备注（留空则显示姓名）',p.remark);if(next!==null){p.remark=next;save();redraw()}})}else if(section==='chats'){c.innerHTML='<h2>微信消息草稿</h2><p class="muted">先配置测试消息，未来可关联微信通知、已读状态和剧情触发。</p><label>聊天对象</label><select id="recipient">'+data.people.filter(p=>p.id!=='wang_lujie').map(p=>'<option value="'+esc(p.id)+'">'+esc(p.remark||p.name)+'</option>').join('')+'</select><label>发送人</label><select id="sender"><option value="contact">对方</option><option value="owner">王橹杰</option></select><label>消息内容</label><textarea id="message" placeholder="输入虚构的测试聊天内容"></textarea><button class="btn" id="addChat">添加消息草稿</button><div id="items"></div>';document.getElementById('addChat').onclick=()=>{if(!val('message'))return alert('请输入消息');data.chats.push({id:uid(),recipient:val('recipient'),sender:val('sender'),text:val('message'),createdAt:new Date().toISOString()});save();redraw()};document.getElementById('items').innerHTML=data.chats.map((m,i)=>'<div class="item"><div><b>'+esc(m.sender==='owner'?'王橹杰':'联系人')+'</b><small>'+esc(m.text)+'</small></div><button data-remove="'+i+'">删除</button></div>').join('');bindDelete('chats')}else if(section==='events'){c.innerHTML='<h2>剧情与彩蛋</h2><p class="muted">彩蛋不限 T-FAMILY，可来自微信、相册、备忘录和任意应用。当前仅记录规则草稿，暂不执行。</p><label>彩蛋名称</label><input id="eventName" placeholder="例如：隐藏照片"><div class="row"><div><label>触发来源</label><select id="eventTrigger"><option value="tfamily">T-FAMILY 内容</option><option value="wechat">微信消息</option><option value="photos">相册照片</option><option value="notes">备忘录</option><option value="app">打开指定应用</option></select></div><div><label>触发结果</label><select id="eventAction"><option value="wechat">收到微信消息</option><option value="photo">解锁照片</option><option value="remark">修改微信备注</option><option value="notice">弹出通知</option><option value="unlock">解锁内容</option></select></div></div><label>触发条件说明</label><textarea id="eventCondition" placeholder="例如：阅读指定消息后才能触发"></textarea><button class="btn" id="addEvent">添加彩蛋草稿</button><div id="items"></div>';document.getElementById('addEvent').onclick=()=>{if(!val('eventName'))return alert('请输入彩蛋名称');data.events.push({id:uid(),name:val('eventName'),trigger:val('eventTrigger'),action:val('eventAction'),condition:val('eventCondition')});save();redraw()};document.getElementById('items').innerHTML=data.events.map((e,i)=>'<div class="item"><div><b>'+esc(e.name)+'</b><small>'+esc(e.trigger)+' → '+esc(e.action)+' · '+esc(e.condition)+'</small></div><button data-remove="'+i+'">删除</button></div>').join('');bindDelete('events')}else if(section==='assets'){c.innerHTML='<h2>素材管理</h2><p class="muted">正式图片、音频、视频上传需要先接入有权限控制的云端存储。当前可以通过导入/导出 JSON 备份人物、消息和剧情草稿。</p><div class="empty">云端素材库尚未连接，避免误以为上传已发布。</div>'}else{c.innerHTML='<h2>草稿备份与恢复</h2><p class="muted">导出 JSON 文件可保存到手机或电脑。导入会覆盖当前浏览器的草稿，请先备份。</p><div class="toolbar"><button id="export">⬇ 导出草稿 JSON</button><button id="importBtn">⬆ 导入草稿 JSON</button><button id="reset">重置本机草稿</button></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><p class="hint">注意：本机草稿不会同步到玩家端，也不是云端备份。正式发布、版本回滚将在接入安全后台后开放。</p>';document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lumu-studio-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!parsed||!Array.isArray(parsed.people)||!Array.isArray(parsed.chats)||!Array.isArray(parsed.events)||!parsed.appearance)throw Error('文件结构不正确');if(confirm('导入将覆盖本机草稿，确定吗？')){data=parsed;save();redraw()}}catch(err){alert('导入失败：'+err.message)}};document.getElementById('reset').onclick=()=>{if(confirm('确定清空当前浏览器的所有草稿？')){data=structuredClone(initial);save();redraw()}}}};function bindDelete(type){document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('删除这条草稿？')){data[type].splice(+b.dataset.remove,1);save();redraw()}})}redraw();
</script></body></html>
