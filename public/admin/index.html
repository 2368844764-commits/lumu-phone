<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuMu Studio · 草稿工作台</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#242632}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e7e9f1;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}header small{display:block;color:#858895;margin-top:3px}a{color:#4463c9;text-decoration:none}main{max-width:1100px;margin:auto;padding:18px}.notice{background:#fff8e8;color:#795a24;padding:13px;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:16px}.layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{border:1px solid #e6e8f0;background:white;border-radius:12px;padding:13px;text-align:left}.menu button.active{background:#e9eefc;border-color:#9db2ec;color:#2c4d9a;font-weight:700}.panel{background:white;border:1px solid #eceef3;border-radius:17px;padding:20px;min-height:400px}h2{font-size:20px;margin:0 0 8px}.muted{color:#858895;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #dfe2eb;border-radius:10px;padding:11px;background:white;color:#242632}textarea{min-height:90px;resize:vertical}.btn{border:0;background:#4165d6;color:white;border-radius:10px;padding:11px 15px;margin:12px 8px 0 0}.secondary{background:#eef1f8;color:#3c4665}.danger{background:#fff0f0;color:#9a3535}.item{border:1px solid #e8eaf0;border-radius:12px;padding:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{display:block;color:#888;margin-top:4px}.item button{border:0;background:#fff0f0;color:#a33;border-radius:8px;padding:7px 10px}.empty{padding:18px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:12px;margin-top:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#777;line-height:1.7}.pill{font-size:11px;background:#eef1f7;border-radius:50px;padding:5px 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.toolbar button{border:1px solid #e0e4ed;border-radius:9px;padding:9px 12px;background:white}.phone{width:185px;height:310px;border:7px solid #222;border-radius:30px;background:linear-gradient(145deg,#f6d5e7,#aabcf0);margin:16px auto;padding:30px 12px;text-align:center}.phone strong{font-size:30px}.phone small{display:block}.hidden{display:none}@media(max-width:700px){main{padding:12px}.layout{display:block}.menu{flex-direction:row;overflow:auto;padding-bottom:10px;margin-bottom:8px}.menu button{white-space:nowrap;flex-shrink:0;padding:11px}.panel{padding:16px;min-height:400px}.row{grid-template-columns:1fr}header{padding:14px}}</style></head><body><header><div><b>LuMu Studio</b><small>手机优先 · 本机草稿工作台</small></div><a href="../">试玩游戏 ↗</a></header><main><div class="notice"><b>当前是本机草稿编辑器，并非正式管理后台。</b>草稿只保存在当前浏览器，尚未同步游戏或云端；请定期导出备份。不要在这里填写真实密码、私人聊天或敏感资料。</div><div class="layout"><nav class="menu" id="menu"></nav><section class="panel"><div id="content"></div></section></div></main><script>
const key='lumu-studio-draft-v1',sections=[['appearance','📱 手机外观'],['apps','🧩 APP 管理'],['wechat','🟢 微信结构'],['wechatChats','💬 微信聊天详情'],['calls','📞 电话与通话'],['photos','🖼️ 相册'],['notes','📝 备忘录'],['countdown','📅 倒数日'],['people','👥 人物与联系人'],['chats','💬 微信消息'],['events','✨ 剧情与彩蛋'],['assets','🖼️ 素材管理'],['versions','🕓 草稿与备份']];
const initial={appearance:{wallpaper:'',title:'LuMu',theme:'#f2a4c9'},people:[{id:'wang_lujie',name:'王橹杰',remark:'',role:'手机主人'},{id:'mu_zhicheng',name:'穆祉丞',remark:'',role:'主线联系人'}],chats:[],events:[],apps:[{id:'wechat',name:'微信',enabled:true,placement:'dock'},{id:'tfamily',name:'T-FAMILY',enabled:true,placement:'home'},{id:'photos',name:'照片',enabled:true,placement:'home'},{id:'notes',name:'备忘录',enabled:true,placement:'home'}],wechat:{tabs:['微信','通讯录','发现','我'],moments:[],contacts:[]},calls:[],photos:[],notes:[],countdowns:[]};
let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)};if(!Array.isArray(data.apps))data.apps=structuredClone(initial.apps);if(!data.wechat)data.wechat=structuredClone(initial.wechat);if(!Array.isArray(data.wechat.moments))data.wechat.moments=[];if(!Array.isArray(data.wechat.conversations))data.wechat.conversations=[];for(const k of ['calls','photos','notes','countdowns'])if(!Array.isArray(data[k]))data[k]=[];let section='appearance';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));alert('草稿已保存到当前浏览器（尚未发布到游戏）')}catch(e){alert('保存失败：'+e.message)}};const val=id=>document.getElementById(id)?.value.trim()||'';const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const redraw=()=>{document.getElementById('menu').innerHTML=sections.map(([id,name])=>'<button class="'+(section===id?'active':'')+'" data-section="'+id+'">'+name+'</button>').join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;redraw()});const c=document.getElementById('content');if(section==='appearance'){c.innerHTML='<h2>手机外观草稿</h2><p class="muted">设置游戏标题、主题颜色和壁纸链接；暂不影响玩家端。</p><label>游戏标题</label><input id="title" value="'+esc(data.appearance.title)+'"><label>主题颜色</label><input id="theme" type="color" value="'+esc(data.appearance.theme)+'"><label>壁纸图片链接（HTTPS）</label><input id="wallpaper" placeholder="https://..." value="'+esc(data.appearance.wallpaper)+'"><div class="phone" id="preview"><small>10月21日</small><strong>16:20</strong><small>手机外观预览</small></div><button class="btn" id="saveAppearance">保存外观草稿</button>';const p=document.getElementById('preview');if(data.appearance.wallpaper)p.style.background='center / cover url("'+encodeURI(data.appearance.wallpaper).replace(/"/g,'%22')+'")';document.getElementById('saveAppearance').onclick=()=>{data.appearance={title:val('title'),theme:val('theme'),wallpaper:val('wallpaper')};save();redraw()}}else if(section==='apps'){c.innerHTML='<h2>APP 管理</h2><p class="muted">添加、隐藏应用，配置名称、位置和顺序。此处是后台草稿，暂未同步玩家手机。</p><label>应用名称</label><input id="appName" placeholder="例如：微博"><label>应用 ID（英文与数字）</label><input id="appId" placeholder="例如：weibo"><label>桌面位置</label><select id="appPlacement"><option value="home">主屏幕</option><option value="dock">Dock 栏</option></select><button class="btn" id="addApp">新增 APP</button><div id="items"></div>';document.getElementById('addApp').onclick=()=>{const id=val('appId').toLowerCase();if(!/^[a-z][a-z0-9_-]*$/.test(id)||!val('appName'))return alert('请填写名称及有效英文 ID');if(data.apps.some(a=>a.id===id))return alert('APP ID 已存在');data.apps.push({id,name:val('appName'),iconUrl:'',enabled:true,placement:val('appPlacement')});save();redraw()};document.getElementById('items').innerHTML=data.apps.map((a,i)=>'<div class="item"><div><b>'+esc(a.name)+'</b><small>'+esc(a.id)+' · '+(a.placement==='dock'?'Dock':'主屏幕')+' · '+(a.enabled?'显示':'隐藏')+'</small></div><div><button data-up="'+i+'">↑</button> <button data-down="'+i+'">↓</button> <button data-toggle="'+i+'">'+(a.enabled?'隐藏':'显示')+'</button> <button data-place="'+i+'">位置</button> <button data-edit-app="'+i+'">编辑名称/图标</button></div></div>').join('');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[data.apps[i-1],data.apps[i]]=[data.apps[i],data.apps[i-1]];save();redraw()}});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;if(i<data.apps.length-1){[data.apps[i+1],data.apps[i]]=[data.apps[i],data.apps[i+1]];save();redraw()}});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{data.apps[+b.dataset.toggle].enabled=!data.apps[+b.dataset.toggle].enabled;save();redraw()});document.querySelectorAll('[data-edit-app]').forEach(b=>b.onclick=()=>{const a=data.apps[+b.dataset.editApp];const name=prompt('APP 显示名称',a.name);if(name===null)return;if(!name.trim())return alert('名称不能为空');const iconUrl=prompt('APP 图标图片链接（HTTPS；留空使用默认图标）',a.iconUrl||'');if(iconUrl===null)return;if(iconUrl.trim()&&!/^https:\/\//.test(iconUrl.trim()))return alert('图标必须为 HTTPS 链接');a.name=name.trim();a.iconUrl=iconUrl.trim();save();redraw()});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const a=data.apps[+b.dataset.place];a.placement=a.placement==='dock'?'home':'dock';save();redraw()})}else if(section==='wechat'){c.innerHTML='<h2>微信结构编辑</h2><p class="muted">以真实微信四个主导航为基础。现阶段可管理朋友圈动态草稿；聊天内容仍在「微信消息」中编辑。尚未接入玩家端。</p><div class="item"><b>微信</b><small>聊天列表 / 消息</small></div><div class="item"><b>通讯录</b><small>与「人物与联系人」共用身份 ID</small></div><div class="item"><b>发现</b><small>朋友圈动态</small></div><div class="item"><b>我</b><small>王橹杰的个人资料</small></div><label>朋友圈发布人</label><select id="momentAuthor">'+data.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select><label>朋友圈文字</label><textarea id="momentText" placeholder="输入虚构朋友圈内容"></textarea><button class="btn" id="addMoment">添加朋友圈草稿</button><div id="items"></div>';document.getElementById('addMoment').onclick=()=>{if(!val('momentText'))return alert('请输入内容');data.wechat.moments.push({id:uid(),authorId:val('momentAuthor'),text:val('momentText'),createdAt:new Date().toISOString()});save();redraw()};document.getElementById('items').innerHTML=data.wechat.moments.map((m,i)=>'<div class="item"><div><b>'+esc(data.people.find(p=>p.id===m.authorId)?.name||m.authorId)+'</b><small>'+esc(m.text)+'</small></div><button data-moment-remove="'+i+'">删除</button></div>').join('');document.querySelectorAll('[data-moment-remove]').forEach(b=>b.onclick=()=>{if(confirm('删除这条朋友圈草稿？')){data.wechat.moments.splice(+b.dataset.momentRemove,1);save();redraw()}})}else if(section==='people'){c.innerHTML='<h2>人物与联系人</h2><p class="muted">人物 ID 固定不变；备注可以随时修改。主线角色不会因为修改备注而变成新联系人。</p><label>人物姓名</label><input id="personName" placeholder="输入人物姓名"><label>微信备注</label><input id="personRemark" placeholder="可留空"><button class="btn" id="addPerson">新增人物草稿</button><div id="items"></div>';document.getElementById('addPerson').onclick=()=>{if(!val('personName'))return alert('请填写姓名');data.people.push({id:uid(),name:val('personName'),remark:val('personRemark'),role:'联系人'});save();redraw()};document.getElementById('items').innerHTML=data.people.map((p,i)=>'<div class="item"><div><b>'+esc(p.name)+'</b><small>'+esc(p.role)+' · 微信备注：'+esc(p.remark||'未设置')+'</small></div><button data-edit="'+i+'">编辑</button></div>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=data.people[+b.dataset.edit],next=prompt('修改微信备注（留空则显示姓名）',p.remark);if(next!==null){p.remark=next;save();redraw()}})}else if(section==='wechatChats'){c.innerHTML='<h2>微信聊天详情</h2><p class="muted">按会话管理聊天记录。支持文字、图片、语音、系统提示、模拟转账、微信通话记录等消息类型；均为虚构剧情草稿。</p><label>聊天对象</label><select id="wxPerson">'+data.people.filter(p=>p.id!=='wang_lujie').map(p=>'<option value="'+esc(p.id)+'">'+esc(p.remark||p.name)+'</option>').join('')+'</select><label>消息方向</label><select id="wxSender"><option value="contact">对方发送</option><option value="owner">王橹杰发送</option><option value="system">系统提示</option></select><label>消息类型</label><select id="wxType"><option value="text">文字</option><option value="image">图片</option><option value="voice">语音</option><option value="video">视频</option><option value="call">微信通话记录</option><option value="transfer">模拟转账</option><option value="recalled">撤回提示</option></select><label>内容或素材 HTTPS 链接</label><textarea id="wxContent" placeholder="文字消息填正文；图片/音频/视频填 HTTPS 素材地址"></textarea><label>显示时间</label><input id="wxTime" type="datetime-local"><label><input id="wxUnread" type="checkbox" style="width:auto"> 标记为未读（仅草稿标记）</label><button class="btn" id="wxAdd">添加微信消息</button><div id="items"></div>';document.getElementById('wxAdd').onclick=()=>{if(!val('wxPerson')||!val('wxContent'))return alert('请选择联系人并填写内容');const type=val('wxType'),content=val('wxContent');if(['image','voice','video'].includes(type)&&!/^https:\/\//.test(content))return alert('媒体消息需要 HTTPS 素材链接');data.wechat.conversations.push({id:uid(),personId:val('wxPerson'),sender:val('wxSender'),type,content,time:val('wxTime')||new Date().toISOString(),unread:document.getElementById('wxUnread').checked});save();redraw()};document.getElementById('items').innerHTML=data.wechat.conversations.map((m,i)=>'<div class="item"><div><b>'+esc(data.people.find(p=>p.id===m.personId)?.remark||data.people.find(p=>p.id===m.personId)?.name||'联系人')+' · '+esc(m.type)+'</b><small>'+esc(m.sender)+' · '+esc(m.content.slice(0,100))+' · '+esc(m.time)+(m.unread?' · 未读':'')+'</small></div><button data-wx-delete="'+i+'">删除</button></div>').join('');document.querySelectorAll('[data-wx-delete]').forEach(b=>b.onclick=()=>{if(confirm('删除消息草稿？')){data.wechat.conversations.splice(+b.dataset.wxDelete,1);save();redraw()}})}else if(section==='calls'){c.innerHTML='<h2>电话与微信通话</h2><p class="muted">配置虚构来电、去电、微信语音及微信视频通话。真实接听界面、铃声、计时和剧情触发将在玩家端实现。</p><label>联系人</label><select id="callPerson">'+data.people.filter(p=>p.id!=='wang_lujie').map(p=>'<option value="'+esc(p.id)+'">'+esc(p.remark||p.name)+'</option>').join('')+'</select><label>通话类型</label><select id="callType"><option value="phone-in">手机来电</option><option value="phone-out">手机去电</option><option value="wechat-voice-in">微信语音来电</option><option value="wechat-voice-out">微信语音去电</option><option value="wechat-video-in">微信视频来电</option><option value="wechat-video-out">微信视频去电</option></select><label>通话状态</label><select id="callStatus"><option value="answered">已接听</option><option value="missed">未接</option><option value="declined">已拒绝</option></select><label>通话时间（可留空）</label><input id="callTime" type="datetime-local"><label>持续秒数</label><input id="callDuration" type="number" min="0" value="0"><button class="btn" id="addCall">添加通话草稿</button><div id="items"></div>';document.getElementById('addCall').onclick=()=>{data.calls.push({id:uid(),personId:val('callPerson'),type:val('callType'),status:val('callStatus'),time:val('callTime')||new Date().toISOString(),duration:Math.max(0,Number(val('callDuration'))||0)});save();redraw()};renderItems('calls',x=>esc((data.people.find(p=>p.id===x.personId)?.remark||data.people.find(p=>p.id===x.personId)?.name||'联系人')+' · '+x.type+' · '+x.status+' · '+x.duration+'秒'))}else if(section==='photos'){c.innerHTML='<h2>相册管理</h2><p class="muted">为虚拟手机创建相册照片条目。当前填写图片 HTTPS 链接；本地图片上传与云端素材存储尚未接入。</p><label>照片标题</label><input id="photoTitle" placeholder="例如：某一天"><label>图片链接（HTTPS）</label><input id="photoUrl" placeholder="https://..."><label>拍摄日期</label><input id="photoDate" type="date"><label>相册名称</label><input id="photoAlbum" placeholder="最近项目"><button class="btn" id="addPhoto">添加照片草稿</button><div id="items"></div>';document.getElementById('addPhoto').onclick=()=>{if(!/^https:\/\//.test(val('photoUrl')))return alert('请填写 HTTPS 图片链接');data.photos.push({id:uid(),title:val('photoTitle'),url:val('photoUrl'),date:val('photoDate'),album:val('photoAlbum')||'最近项目'});save();redraw()};renderItems('photos',x=>esc((x.title||'未命名照片')+' · '+x.album+' · '+x.date))}else if(section==='notes'){c.innerHTML='<h2>备忘录管理</h2><p class="muted">支持多条备忘录、标题、正文和文件夹。后续可关联微信消息和剧情线索。</p><label>备忘录标题</label><input id="noteTitle" placeholder="例如：待办事项"><label>文件夹</label><input id="noteFolder" placeholder="备忘录"><label>正文</label><textarea id="noteBody" placeholder="输入备忘录内容"></textarea><button class="btn" id="addNote">添加备忘录草稿</button><div id="items"></div>';document.getElementById('addNote').onclick=()=>{if(!val('noteTitle'))return alert('请输入标题');data.notes.push({id:uid(),title:val('noteTitle'),folder:val('noteFolder')||'备忘录',body:val('noteBody'),updatedAt:new Date().toISOString()});save();redraw()};renderItems('notes',x=>esc(x.title+' · '+x.folder+' · '+x.body.slice(0,45)))}else if(section==='countdown'){c.innerHTML='<h2>倒数日与纪念日</h2><p class="muted">添加重要日期，未来在玩家手机中自动计算距今多少天，支持已过去纪念日与未来倒计时。</p><label>纪念日名称</label><input id="dayTitle" placeholder="例如：特别的日子"><label>日期</label><input id="dayDate" type="date"><label>类型</label><select id="dayType"><option value="anniversary">纪念日（已过去天数）</option><option value="countdown">倒计时（剩余天数）</option></select><label>主题颜色</label><input id="dayColor" type="color" value="#f2a4c9"><button class="btn" id="addDay">添加日期草稿</button><div id="items"></div>';document.getElementById('addDay').onclick=()=>{if(!val('dayTitle')||!val('dayDate'))return alert('请填写名称和日期');data.countdowns.push({id:uid(),title:val('dayTitle'),date:val('dayDate'),type:val('dayType'),color:val('dayColor')});save();redraw()};renderItems('countdowns',x=>esc(x.title+' · '+x.date+' · '+(x.type==='anniversary'?'纪念日':'倒计时')))}}else if(section==='chats'){c.innerHTML='<h2>微信消息草稿</h2><p class="muted">先配置测试消息，未来可关联微信通知、已读状态和剧情触发。</p><label>聊天对象</label><select id="recipient">'+data.people.filter(p=>p.id!=='wang_lujie').map(p=>'<option value="'+esc(p.id)+'">'+esc(p.remark||p.name)+'</option>').join('')+'</select><label>发送人</label><select id="sender"><option value="contact">对方</option><option value="owner">王橹杰</option></select><label>消息内容</label><textarea id="message" placeholder="输入虚构的测试聊天内容"></textarea><button class="btn" id="addChat">添加消息草稿</button><div id="items"></div>';document.getElementById('addChat').onclick=()=>{if(!val('message'))return alert('请输入消息');data.chats.push({id:uid(),recipient:val('recipient'),sender:val('sender'),text:val('message'),createdAt:new Date().toISOString()});save();redraw()};document.getElementById('items').innerHTML=data.chats.map((m,i)=>'<div class="item"><div><b>'+esc(m.sender==='owner'?'王橹杰':'联系人')+'</b><small>'+esc(m.text)+'</small></div><button data-remove="'+i+'">删除</button></div>').join('');bindDelete('chats')}else if(section==='events'){c.innerHTML='<h2>剧情与彩蛋</h2><p class="muted">彩蛋不限 T-FAMILY，可来自微信、相册、备忘录和任意应用。当前仅记录规则草稿，暂不执行。</p><label>彩蛋名称</label><input id="eventName" placeholder="例如：隐藏照片"><div class="row"><div><label>触发来源</label><select id="eventTrigger"><option value="tfamily">T-FAMILY 内容</option><option value="wechat">微信消息</option><option value="photos">相册照片</option><option value="notes">备忘录</option><option value="app">打开指定应用</option></select></div><div><label>触发结果</label><select id="eventAction"><option value="wechat">收到微信消息</option><option value="photo">解锁照片</option><option value="remark">修改微信备注</option><option value="notice">弹出通知</option><option value="unlock">解锁内容</option></select></div></div><label>触发条件说明</label><textarea id="eventCondition" placeholder="例如：阅读指定消息后才能触发"></textarea><button class="btn" id="addEvent">添加彩蛋草稿</button><div id="items"></div>';document.getElementById('addEvent').onclick=()=>{if(!val('eventName'))return alert('请输入彩蛋名称');data.events.push({id:uid(),name:val('eventName'),trigger:val('eventTrigger'),action:val('eventAction'),condition:val('eventCondition')});save();redraw()};document.getElementById('items').innerHTML=data.events.map((e,i)=>'<div class="item"><div><b>'+esc(e.name)+'</b><small>'+esc(e.trigger)+' → '+esc(e.action)+' · '+esc(e.condition)+'</small></div><button data-remove="'+i+'">删除</button></div>').join('');bindDelete('events')}else if(section==='assets'){c.innerHTML='<h2>素材管理</h2><p class="muted">正式图片、音频、视频上传需要先接入有权限控制的云端存储。当前可以通过导入/导出 JSON 备份人物、消息和剧情草稿。</p><div class="empty">云端素材库尚未连接，避免误以为上传已发布。</div>'}else{c.innerHTML='<h2>草稿备份与恢复</h2><p class="muted">导出 JSON 文件可保存到手机或电脑。导入会覆盖当前浏览器的草稿，请先备份。</p><div class="toolbar"><button id="export">⬇ 导出草稿 JSON</button><button id="importBtn">⬆ 导入草稿 JSON</button><button id="reset">重置本机草稿</button></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><p class="hint">注意：本机草稿不会同步到玩家端，也不是云端备份。正式发布、版本回滚将在接入安全后台后开放。</p>';document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lumu-studio-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!parsed||!Array.isArray(parsed.people)||!Array.isArray(parsed.chats)||!Array.isArray(parsed.events)||!parsed.appearance)throw Error('文件结构不正确');if(confirm('导入将覆盖本机草稿，确定吗？')){data=parsed;save();redraw()}}catch(err){alert('导入失败：'+err.message)}};document.getElementById('reset').onclick=()=>{if(confirm('确定清空当前浏览器的所有草稿？')){data=structuredClone(initial);save();redraw()}}}};function renderItems(type,label){document.getElementById('items').innerHTML=data[type].map((x,i)=>'<div class="item"><div><b>'+label(x)+'</b></div><button data-remove="'+i+'">删除</button></div>').join('');bindDelete(type)}function bindDelete(type){document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('删除这条草稿？')){data[type].splice(+b.dataset.remove,1);save();redraw()}})}redraw();
</script></body></html>
